  - key: about.content.css2021
    t: >
      2021 की State of CSS सर्वेक्षण 5 अक्टूबर से 2 नवंबर 2021 तक चला, और इसमें 8714 प्रतिक्रियाएँ एकत्रित की गईं। यह सर्वेक्षण मैंने, [साचा ग्रेफ](https://sachagreif.com/), द्वारा ओपन-सोर्स योगदानकर्ताओं और सलाहकारों की टीम की मदद से चलाया गया।  

      इस वर्ष का लोगो और टी-शर्ट [क्रिस्टोफर किर्क-नीलसन](http://chriskirknielsen.com/) द्वारा डिज़ाइन और एनिमेट किया गया।  

      ### सर्वेक्षण के उद्देश्य

      यह सर्वेक्षण, [State of JavaScript](https://stateofjs.com/) सर्वेक्षण के साथ, वेब विकास इकोसिस्टम में आने वाले रुझानों की पहचान करने के लिए बनाया गया था ताकि डेवलपर्स तकनीकी विकल्प चुन सकें।  

      इसलिए, ये सर्वेक्षण इस बात पर केंद्रित हैं कि अगले कुछ वर्षों में क्या आने वाला है, बजाय इसके कि वर्तमान में क्या लोकप्रिय है, इसीलिए वर्तमान में सबसे व्यापक रूप से उपयोग की जाने वाली सुविधाएँ या तकनीकें हमेशा शामिल नहीं होतीं।  

      ### सर्वेक्षण डिज़ाइन

      सर्वेक्षण को आंशिक रूप से पिछले वर्ष के सर्वेक्षण के आधार पर डिज़ाइन किया गया था, जिसमें एक खुली प्रतिक्रिया अवधि थी, जहाँ सर्वेक्षण की रूपरेखा [GitHub पर](https://github.com/StateOfJS/StateOfCSS-2020/issues/8) चर्चा की गई।  

      सभी सर्वेक्षण प्रश्न वैकल्पिक थे।  

      ### सर्वेक्षण दर्शक

      यह सर्वेक्षण ऑनलाइन खुले रूप से उपलब्ध था और प्रतिभागियों को किसी भी तरह से फ़िल्टर या चयनित नहीं किया गया था। प्रतिभागियों में मुख्य रूप से पिछले सर्वेक्षणों के प्रतिभागियों का मिश्रण (विशेष मेलिंग सूची के माध्यम से सूचित) और सोशल मीडिया ट्रैफ़िक शामिल था।  

      ### प्रतिनिधित्व और समावेशन

      जबकि हम मानते हैं कि हर समुदाय की आवाज़ को देना महत्वपूर्ण है, वास्तविकता यह है कि इस तरह का खुला सर्वेक्षण हमेशा सभी का सही प्रतिनिधित्व करने में संघर्ष करेगा, खासकर उन सिस्टम्स के माध्यम से कार्य करते समय जिनमें पहले से ही अपनी अंतर्निहित पूर्वाग्रह मौजूद हैं।  

      इसे संतुलित करने के लिए, हम तीन अलग-अलग रणनीतियाँ लागू कर रहे हैं:  

      - **आउटरीच**: इस वर्ष, हमने BIPOC और LGBTQ डेवलपर्स का प्रतिनिधित्व करने वाले 23 संगठनों तक पहुँचने की कोशिश की, साझेदारी की आशा में। हालांकि उनमें से बहुत कम ने उत्तर दिया, हम अपने वर्तमान दर्शकों से परे पहुँचने के तरीके खोजते रहेंगे।  

      - **डेटा विश्लेषण**: फ़ैसेट्स और वेरिएंट्स जैसी सुविधाओं के माध्यम से, हम हमेशा किसी भी डेमोग्राफिक सेगमेंट की आवाज़ को उजागर करना आसान बनाने की कोशिश करते हैं, चाहे वह हमारे डेटा में कितना भी अल्पसंख्यक क्यों न हो।  

      - **बाधा कम करना**: सर्वेक्षण को बहुत लंबा, असुलभ, धीमा, केवल अंग्रेज़ी में आदि बनाना "प्रयास कर" टैक्स लगाने में योगदान दे सकता है, जो उस समुदाय के हिस्सों को काट देता है जो इसे वहन नहीं कर सकते। इन समस्याओं को ठीक करने से प्रवेश की बाधा कम होती है और हमारे दर्शक अधिक विविध बनते हैं।  

      ### परियोजना फंडिंग

      इस परियोजना के फंडिंग स्रोत विभिन्न हैं:  

      - **टी-शर्ट बिक्री**।  

      - **प्रायोजित लिंक**: प्रत्येक पेज के नीचे सुझाए गए संसाधनों के लिंक हमारे साझेदार [Frontend Masters](https://frontendmasters.com/) द्वारा प्रदान किए जाते हैं।  

      - **अन्य फंडिंग**: इस वर्ष, [Google Chrome](https://www.google.com/chrome/) टीम ने सर्वेक्षण पर काम करने के लिए एक [सुलभता सलाहकार](https://fossheim.io/) को नियुक्त करने में मदद करने के लिए एक छोटा बजट निर्धारित किया।  

      इन फंडिंग स्रोतों के बावजूद, सर्वेक्षण कुल मिलाकर ज्यादातर आत्म-निधारित परियोजना बनी हुई है और किसी भी योगदान या प्रायोजन की अत्यधिक सराहना की जाएगी। मैं विशेष रूप से और अधिक ब्राउज़र विक्रेताओं के साथ काम करना चाहूंगा, क्योंकि वे वेब इकोसिस्टम में एक केंद्रीय भूमिका निभाते हैं।  

      ### तकनीकी अवलोकन

      आप यहाँ [अधिक तकनीकी विवरण](https://dev.to/sachagreif/how-the-state-of-js-css-surveys-are-run-4lnb) पा सकते हैं कि सर्वेक्षण कैसे चलाए जाते हैं।  

      - **डेटा संग्रह**: कस्टम [Vulcan.js](http://vulcanjs.org/) ऐप।  
      - **डेटा संग्रहण/प्रसंस्करण**: MongoDB और MongoDB Aggregations।  
      - **डेटा API**: Node.js GraphQL API।  
      - **परिणाम साइट**: [Gatsby](https://www.gatsbyjs.com/) React ऐप।  
      - **डेटा विज़ुअलाइज़ेशन**: [Nivo](https://nivo.rocks/) React डाटाविज़ लाइब्रेरी।  
      - **फॉन्ट प्रकार**: [IBM Plex Mono](https://fonts.google.com/specimen/IBM+Plex+Mono) और [Bebas Neue](https://fonts.google.com/specimen/Bebas+Neue)।  

  - key: general.css2021.survey_intro
    t: |
      अरे CSS, हाल ही में तुम क्या कर रहे थे? सच में, `@container`? ओह और intrinsic sizing? और `@property` भी?! वाह, तुम तो काफी व्यस्त रहे!  

      भले ही महामारी ने 2021 के दौरान हर किसी की जिंदगी को कठिन बनाया, दुनिया भर के समर्पित योगदानकर्ताओं ने किसी तरह CSS को आगे बढ़ाया।  
      और इसलिए एक बार फिर CSS इकोसिस्टम का सर्वेक्षण करने और यह पता लगाने का समय है कि यह सब कहाँ जा रहा है।  
      और शायद इस बीच कुछ नई चीज़ें भी सीख लें!
