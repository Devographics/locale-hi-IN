  ###########################################################################
  # Introduction
  ###########################################################################

  - key: general.results.description
    t: 2021 के संस्करण में CSS इकोसिस्टम में नवीनतम रुझानों पर वार्षिक सर्वेक्षण का विवरण है।  

  - key: introduction.css2021
    t: |
      <span class="first-letter">क्या</span> बढ़ई हर कुछ साल में किसी बोर्ड को काटने का नया, बेहतर तरीका सीखते हैं? क्या चित्रकार अब भी ऑयल पेंट इस्तेमाल करने पर खुद को धोखेबाज महसूस करते हैं? या फिर केवल हम फ्रंट-एंड डेवलपर्स ही इस लगातार बदलती स्थिति का अनुभव करते हैं?

      कंटेनर क्वेरीज़ और अन्य फीचर्स के आने के साथ, चीजें निश्चित रूप से तेजी से बदल रही हैं। और हमें भी इसके साथ बने रहना है, इसलिए हमने इन सर्वेक्षण परिणामों को कुछ नए पावर-अप्स दिए हैं!  

      इसका मतलब यह है कि अब हम दो डेटा पॉइंट्स का क्रॉस-रेफ़रेंस कर सकते हैं, जैसे कि अनुभव स्तर के अनुसार वार्षिक वेतन; या देश के अनुसार लिंग। आप परिणामों में कुछ ऐसे ब्रेकडाउन देखेंगे, लेकिन हम आपको [हमारे API](https://api.stateofjs.com/) या [डेटा डाउनलोड करने](https://www.kaggle.com/sachag/state-of-css) के माध्यम से डेटा को और अधिक एक्सप्लोर करने के लिए प्रोत्साहित करते हैं। हमें बताएं अगर आप अपने खुद के डेटा विज़ुअलाइज़ेशन बनाते हैं!  

      और अब, चलिए देखते हैं कि इस साल CSS ने क्या किया है!  

      *नोट: समय की कमी के कारण 2021 का [State of JavaScript](http://stateofjs.com/) सर्वेक्षण जनवरी 2022 तक स्थगित करना पड़ा। छुट्टियों के बाद मिलते हैं!*  

      <span class="conclusion__byline">– साचा ग्रेइफ</span>  

  ###########################################################################
  # Sections Introductions
  ###########################################################################

  - key: sections.user_info.description
    t: इस साल के सर्वेक्षण में दुनिया भर के **8,714** डेवलपर्स ने भाग लिया।  

  - key: sections.features.description
    t: CSS की गतिशीलता रुकने का नाम नहीं ले रही है, क्योंकि डेवलपर्स वर्तमान नए फीचर्स को अपनाने का प्रयास कर रहे हैं और आने वाले वर्षों में और अधिक नवाचार की प्रतीक्षा कर रहे हैं।  

  - key: sections.technologies.description
    t: लगभग 50% उत्तरदाता खुशी-खुशी एक या अधिक CSS-in-JS लाइब्रेरी का उपयोग कर रहे हैं, जिससे कहा जा सकता है कि इस श्रेणी ने अपना स्थान बना लिया है। शायद फ्रंट-एंड की दोनों दुनियाएं इतनी दूर नहीं हैं?  

  - key: sections.tools_others.description
    t: किसी तकनीक का चयन अक्सर प्रतियोगी प्राथमिकताओं के बीच कठिन विकल्पों में बदल जाता है, और इस साल हमने इस प्रक्रिया को नए ब्रैकेट-स्टाइल प्रश्न फॉर्मेट में कैप्चर करने की कोशिश की।  

  - key: sections.environments.description
    t: वेब डेवलपमेंट में ऐक्सेसिबिलिटी अक्सर बाद में ध्यान में आती रही है, लेकिन अब कई डेवलपर्स समझ रहे हैं कि यह वास्तव में वह आधार है जिस पर सब कुछ टिका होना चाहिए।  

  - key: sections.resources.description
    t: ब्लॉग, पॉडकास्ट और साइट्स को उजागर करना ठीक है, लेकिन इस साल हमने एक कदम आगे बढ़ाया और वास्तव में CSS समुदाय के लोगों को प्रमुखता दी!  

  - key: sections.opinions.description
    t: चाहे यह आज आपको रोकने वाले पेन पॉइंट्स हों, या कल इस्तेमाल करने की उम्मीद वाले फीचर्स, यह आपका मौका था CSS के प्रति अपनी नाराजगी साझा करने का!  

