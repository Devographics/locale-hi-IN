  ###########################################################################
  # Conclusion
  ###########################################################################

  - key: conclusion.css2021
    t: |
      <span class="first-line">CSS लिखने का तरीका हमेशा के लिए बदलने वाला है</span>

      कई वर्षों से, वेब स्टाइल लिखने में कई नवाचार अन्य जगहों पर हुए हैं: प्रीप्रोसेसर, जावास्क्रिप्ट फ्रेमवर्क, या कंपाइलर्स में। निश्चित रूप से, CSS में भी [aspect-ratio](https://developer.mozilla.org/en-US/docs/Web/CSS/aspect-ratio) या [custom properties](https://developer.mozilla.org/en-US/docs/Web/CSS/--*) जैसी कुछ महत्वपूर्ण सुधार आए हैं। फिर भी हम रोज़ाना लाइब्रेरी और अन्य हेल्पर्स का उपयोग करते हैं।  

      लेकिन एक बदलाव आने वाला है। मूल CSS भाषा में नए सुधार और बदलाव हो रहे हैं, और हम इसके अग्रिम मोर्चे पर हैं।  

      [Container Queries](https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Container_Queries) पूरी तरह नए रिस्पॉन्सिव डिज़ाइन युग को लाएंगे, और [Cascade Layers](https://developer.mozilla.org/en-US/docs/Web/CSS/@layer) फ्रेमवर्क, थीमिंग और जटिल कोडबेस प्रबंधन को आसान बनाएंगे।  

      थोड़ा आगे देखते हुए, [@when/else conditional](https://css-tricks.com/proposal-for-css-when/) भी आने वाला है, जो मीडिया, कंटेनर और सपोर्ट्स क्वेरीज़ को एक ही एट-रूल में जोड़ देगा।  

      और उम्मीद है कि 2022 वह साल होगा जब हम CSS नेस्टिंग में कुछ प्रगति देखेंगे। Sass और PostCSS जैसे टूल्स के उपयोगकर्ता इसके बिना काम करना मुश्किल मानते हैं।  

      इसका मतलब है कि 2022 में CSS लिखने का तरीका मूल रूप से बदलने वाला है। यह बेहद रोमांचक समय है, और हम आने वाले वर्षों में सभी अद्भुत कार्यान्वयन के लिए उत्साहित हैं।  

  - key: conclusion.css2021.bio
    t: वेब डेवलपर और Polypane के निर्माता  

