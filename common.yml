  ###########################################################################
  # General
  ###########################################################################

  # homepage
  - key: general.why_create_account
    t: मुझे एक खाता बनाने की आवश्यकता क्यों है?
  - key: general.create_account_reasons
    t: >
      हम आपसे खाता बनाने के लिए इसलिए कहते हैं ताकि हम:

      - डुप्लिकेट प्रतिक्रियाओं से बच सकें

      - आपको आपके डेटा तक पहुँच दे सकें

      - आपकी प्रगति को सहेज सकें

      - जब परिणाम प्रकाशित हों, तो आपको सूचित कर सकें
  - key: general.survey_closed_detailed
    t: >
      क्षमा करें, यह सर्वेक्षण अब बंद हो चुका है! आप अभी भी अपने डेटा को देख सकते हैं लेकिन उसे संशोधित नहीं कर पाएंगे।
  - key: general.survey_read_only
    t: >
      आप वर्तमान में इस सर्वेक्षण को केवल-पठन (read-only) मोड में देख रहे हैं।
  - key: general.survey_preview
    t: >
      यह सर्वेक्षण **पूर्वावलोकन मोड (preview mode)** में है। इसके प्रश्न बदल सकते हैं, और अभी जो भी डेटा आप दर्ज करेंगे, वह सर्वेक्षण शुरू होने पर **हटा दिया जाएगा**।
  - key: general.survey_feedback
    t: प्रतिक्रिया दें

  - key: general.survey_read_only_back
    t: >
      सत्र शुरू या फिर से जारी रखने के लिए <a href="{link}">मुख्य सर्वेक्षण पृष्ठ पर वापस जाएँ</a>।
  - key: general.take_survey
    t: {name} सर्वेक्षण में भाग लें

  - key: options.na
    t: 🚫 कोई नहीं

