  # thanks
  - key: general.back
    t: वापस जाएँ
  - key: general.back_to_survey
    t: सर्वेक्षण पर वापस जाएँ
  - key: general.thanks
    t: >
      सर्वेक्षण भरने के लिए धन्यवाद! आपका डेटा सहेजा जा चुका है।

      साथ ही, आप इस सर्वेक्षण को साझा करके हमारी पहुँच बढ़ाने में मदद कर सकते हैं। हर एक साझा मायने रखता है और इससे हमारा डेटा और अधिक प्रतिनिधिक बनेगा:

  - key: general.thanks1
    t: >
      सर्वेक्षण भरने के लिए धन्यवाद! आपका डेटा सहेजा जा चुका है।
  - key: general.thanks2
    t: >
      इस सर्वेक्षण को साझा करके हमें अधिक लोगों तक पहुँचने में मदद करें! हर साझा महत्वपूर्ण है और इससे हमारा डेटा और अधिक प्रतिनिधिक बनेगा।
  - key: thanks.learn_more_about
    t: "कुछ विशेषताएँ जिनके बारे में आप और जानना चाह सकते हैं:"
  - key: thanks.knowledge_score
    t: ज्ञान स्कोर
  - key: thanks.features_score
    t: विशेषता स्कोर
  - key: thanks.quiz_score
    t: क्विज़ स्कोर
  - key: thanks.score_statistics
    t: >
      सर्वेक्षण में उल्लिखित {total} विशेषताओं में से,
      आपने {usage_count} का उपयोग किया है और {awareness_count} के बारे में सुना है,
      जिससे आप सभी प्रतिभागियों में शीर्ष {knowledgeRankingFromTop} में आते हैं।
      बहुत बढ़िया!
  - key: thanks.score_statistics_noranking
    t: >
      सर्वेक्षण में उल्लिखित {total} विशेषताओं में से,
      आपने {usage_count} का उपयोग किया है और {awareness_count} के बारे में सुना है।
      बहुत बढ़िया!
  - key: thanks.points
    t: >
      अंक
  - key: thanks.score_awareness_explanation
    t: >
      निष्पक्षता के लिए, यह प्रतिशत केवल उन {awareness_total} विशेषताओं पर आधारित है जिन्हें आप जानते हैं।
  - key: thanks.share_on_twitter
    t: ट्विटर पर साझा करें
  - key: thanks.share_score_message
    t: >
      मैंने इस वर्ष के #{hashtag} सर्वेक्षण में {score} अंकों का ज्ञान स्कोर प्राप्त किया!
      मैंने {usage_count} विशेषताओं का उपयोग किया और {awareness_count} और को जाना,
      जिससे मैं सभी प्रतिभागियों में शीर्ष {rank}% में हूँ।
      क्या आप मेरा स्कोर हरा सकते हैं? {shareUrl}

