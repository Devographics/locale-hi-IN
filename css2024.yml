  - key: faq.how_long_will_survey_take_css2024
    t: सर्वे पूरा करने में कितना समय लगेगा?
  - key: faq.how_long_will_survey_take_css2024.description
    t: >
      आप कितने प्रश्नों का उत्तर देते हैं इस पर निर्भर करता है (सभी प्रश्नों को छोड़ा जा सकता है)। 
      सर्वे पूरा करने में लगभग 15-20 मिनट लगने चाहिए।

  - key: faq.learn_more_css2024
    t: मैं और कहाँ सीख सकता हूँ?
  - key: faq.learn_more_css2024.description
    t: आप इस सर्वे के बारे में [हमारे घोषणा पोस्ट](https://dev.to/sachagreif/the-2024-state-of-css-survey-is-now-open-4o5h) में और जान सकते हैं।

  - key: faq.survey_design_css2024
    t: यह सर्वे कैसे डिज़ाइन किया गया था?
  - key: faq.survey_design_css2024.description
    t: >
      इस सर्वे को [ओपन डिज़ाइन प्रक्रिया](https://github.com/Devographics/surveys/issues/245) के परिणामस्वरूप डिज़ाइन किया गया था, जिसमें ब्राउज़र विक्रेता और वेब विकास समुदाय शामिल थे।

  - key: faq.results_released_css2024
    t: परिणाम कब जारी किए जाएंगे?
  - key: faq.results_released_css2024.description
    t: सर्वे 17 अगस्त से 7 सितंबर 2024 तक चलेगा, और इसके परिणाम उसके तुरंत बाद जारी किए जाएंगे।

  - key: about.content.css2024
    t: >
      2024 स्टेट ऑफ CSS सर्वे 17 अगस्त से 12 सितंबर 2024 तक चला और इसने 9,704 प्रतिक्रियाएँ एकत्र कीं। सर्वे [Devographics](https://www.devographics.com/) द्वारा चलाया गया, ओपन-सोर्स योगदानकर्ताओं और सलाहकारों की मदद से। 

      स्टेट ऑफ CSS का लोगो और टी-शर्ट [Christopher Kirk-Nielsen](http://chriskirknielsen.com/) द्वारा डिज़ाइन और एनीमेट किया गया।

      ### सर्वे के लक्ष्य

      यह सर्वे वेब विकास पारिस्थितिकी तंत्र में आने वाले रुझानों की पहचान करने के लिए बनाया गया था ताकि डेवलपर्स तकनीकी विकल्प चुन सकें। 

      इसलिए, यह सर्वे वर्तमान में सबसे लोकप्रिय तकनीकों का विश्लेषण करने की बजाय आगामी वर्षों में क्या आने वाला है, इस पर ध्यान केंद्रित करता है। 

      इसके अलावा, सर्वे डेटा ब्राउज़र विक्रेताओं द्वारा सुविधाओं को प्राथमिकता देने और [Interop 2024](https://web.dev/blog/interop-2024) जैसी पहलों को सूचित करने के लिए भी उपयोग किया जाता है।

      ### सर्वे डिज़ाइन

      इस सर्वे को [GitHub](https://github.com/Devographics/surveys/issues/245) पर सहयोगात्मक रूप से डिज़ाइन किया गया।

      ### सर्वे दर्शक

      सर्वे ऑनलाइन खुला और सभी के लिए उपलब्ध था। प्रतिक्रियाकर्ताओं को किसी भी तरह से फ़िल्टर या चयनित नहीं किया गया। प्रतिक्रियाएँ मुख्य रूप से पिछले सर्वे के प्रतिभागियों (डेडिकेटेड मेलिंग सूची के माध्यम से) और सोशल मीडिया ट्रैफ़िक से आई थीं। 

      ### परियोजना वित्तपोषण

      टी-शर्ट की बिक्री के अलावा, इस परियोजना का वित्तपोषण कई स्रोतों से आता है:

      - हमारे साथी [Frontend Masters](https://frontendmasters.com/) सर्वे को प्रायोजित करते हैं और इसके बदले में उनके कोर्स के लिंक पृष्ठों के नीचे दिखाई देते हैं।
      - [Google Chrome](https://www.google.com/chrome/) टीम ने इस साल सर्वे डिज़ाइन और संचालन में मदद करने के लिए बजट आवंटित किया।
      - [TokyoDev](https://www.tokyodev.com/) भी इस सर्वे को नियमित रूप से प्रायोजित कर रहा है।

      ### तकनीकी अवलोकन

      सर्वे कैसे चलाए जाते हैं, इसका अधिक गहन तकनीकी विवरण आप [यहाँ](https://dev.to/sachagreif/how-the-devographics-surveys-are-run-2023-edition-1p6a) पा सकते हैं। हमारा कोड [ओपन-सोर्स](https://github.com/Devographics/Monorepo/) है। 

