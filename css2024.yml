locale: hi-IN
translations:
  ###########################################################################
  # General
  ###########################################################################

  - key: general.results.description
    t: CSS इकोसिस्टम में नवीनतम रुझानों के बारे में वार्षिक सर्वेक्षण का 2024 संस्करण।

  - key: general.css2024.survey_intro
    t: |
      यह देखना अद्भुत है कि CSS कितनी तेजी से विकसित हो रहा है। पिछले दशक में लेआउट (Flexbox, Grid) और सिंटैक्स (variables) के लिए एक ठोस आधार बनाने पर ध्यान केंद्रित किया गया था, लेकिन भविष्य हमें बहुत आगे ले जाने का वादा करता है, जितना हमने कभी सोचा भी नहीं था।  

      CSS में वर्गमूल या कोसाइन की गणना करना चाहते हैं? इसका उपयोग स्क्रॉल-ट्रिगर किए गए एनिमेशन बनाने के लिए? और शायद इसे पूरी तरह सीमित करना ताकि इसके कोई अनचाहे प्रभाव न हों? अब आप यह सब और भी बहुत कुछ कर सकते हैं!  

      यही कारण है कि यह सर्वेक्षण पहले से कहीं अधिक महत्वपूर्ण है, न केवल अपने स्वयं के प्रगति पर नज़र रखने के लिए; बल्कि ब्राउज़र विक्रेताओं को यह बताने के लिए कि हम सभी इस नई दिशा के बारे में क्या सोचते हैं।  

      तो एक बार फिर, कृपया इस साल के State of CSS में हमारे साथ शामिल हों!

  - key: features.features_intro_css2024
    t: |
      सर्वेक्षण में आपका स्वागत है! यह पहला भाग विभिन्न CSS फीचर्स के साथ अपने अनुभव को साझा करने के बारे में है:  

      - **कभी नहीं सुना**: यह आपका पहली बार है या आपने इसके बारे में सुना है लेकिन आपको नहीं पता कि यह क्या करता है।  

      - **सुना है**: आपने इसके बारे में पढ़ा या सीखा है, लेकिन आपने वास्तव में इसका उपयोग नहीं किया है।  

      - **उपयोग किया है**: आपने इसे कम से कम एक बार उपयोग किया है, भले ही यह सिर्फ खेलने के लिए ही क्यों न हो।  

      वैसे, यदि आप किसी भी विकल्प के बारे में हमें और बताना चाहते हैं, तो बस उस छोटे "comment" आइकन पर क्लिक करें!

  ###########################################################################
  # Introduction
  ###########################################################################

  - key: introduction.css2024
    t: |
      <span class="first-letter">म</span>ुझे एक भविष्यवाणी करने दीजिए: हम 2024 को "CSS Classic" और "New CSS" के बीच एक मोड़ के रूप में देखेंगे।  

      CSS Classic वह तरीका है जिस तरह से हममें से अधिकांश वर्षों से CSS लिख रहे हैं: सीमित फीचर्स का उपयोग करना, और भाषा की सीमाओं की भरपाई के लिए बाहरी टूल्स जैसे लाइब्रेरीज़, प्री- और पोस्ट-प्रोसेसर, और सख्त कार्यप्रणालियों का सहारा लेना।  

      दूसरी ओर, New CSS एक ऐसा दृष्टिकोण है जो Subgrid, `:has()`, वेरिएबल्स, कंटेनर क्वेरीज़, और हाल के वर्षों में पेश किए गए कई नए और रोमांचक CSS फीचर्स को अपनाता है, ताकि न केवल अतिरिक्त टूलिंग की आवश्यकता खत्म हो, बल्कि उन कार्यों को भी संभाला जा सके जिनके लिए पहले जटिल JavaScript वर्कअराउंड की जरूरत होती थी।  

      यह सब संभव है ब्राउज़र विक्रेताओं की नवीनीकृत प्रतिबद्धता के कारण कि, आप जानते हैं, वास्तव में *इन चीज़ों को काम करने योग्य बनाएं* – और मुझे यह भावना है कि हमने अभी तक New CSS की पूरी संभावनाओं की सतह को भी छुआ नहीं है।  

      <span class="conclusion__byline">– साचा ग्रेइफ़</span>

  ###########################################################################
  # Sections Introductions
  ###########################################################################

  - key: sections.user_info.description.css2024
    t: |
      इस साल का सर्वे **9,704** डेवलपर्स तक दुनिया भर में पहुँचा।

  - key: sections.features.description.css2024
    t: |
      यह कोई रहस्य नहीं है कि CSS रिकॉर्ड गति से नए फीचर्स जोड़ रहा है – यही कारण है कि इस साल हमने **50** से कम फीचर्स के बारे में नहीं पूछा!

  - key: sections.tools.css2024
    t: लाइब्रेरीज़ और टूल्स

  - key: sections.tools.description.css2024
    t: |
      CSS के नए फीचर्स द्वारा अनलॉक की गई कई क्षमताओं के बावजूद, डेवलपर्स अभी भी अपने वर्कफ़्लो का समर्थन करने के लिए टूलिंग और लाइब्रेरीज़ पर भरोसा करते हैं, कम से कम अभी के लिए।

  - key: sections.usage.description.css2024
    t: |
      चाहे आप CSS का किसी भी तरह से उपयोग करें, डेटा दिखाता है कि यह सुनिश्चित करना कि आपका कोड सभी ब्राउज़रों में काम करे, अभी भी एक चिंता का विषय है, खासकर नए फीचर्स जैसे `:has()` के लिए।

  - key: sections.resources.description.css2024
    t: |
      निश्चिंत रहें: इतने सारे नए CSS फीचर्स आने के कारण, CSS ब्लॉग पोस्ट्स, पॉडकास्ट्स, वीडियो और कोर्सेज के लिए सामग्री की कमी कभी नहीं होगी!

  ###########################################################################
  # Charts
  ###########################################################################

  # user_info

  - key: user_info.country.takeaway.css2024
    t: >
      जबकि अमेरिका अभी भी सबसे बड़ा एकल डेमोग्राफिक दर्शाता है, हमें यह देखकर खुशी हुई कि हमारे बाकी प्रतिभागियों में विभिन्न देशों का अच्छा मिश्रण था – हालांकि, दुख की बात है कि एशिया अभी भी कम प्रतिनिधित्व वाला क्षेत्र बना हुआ है।

  - key: user_info.locale.takeaway.css2024
    t: >
      हमारे स्वयंसेवक अनुवादकों का बहुत धन्यवाद जिन्होंने सर्वे को इतनी सारी अलग-अलग भाषाओं में उपलब्ध कराया!

  - key: user_info.completion_stats.takeaway.css2024
    t: >
      सर्वे की लंबाई के बावजूद, अभूतपूर्व बहुमत ने इसे शुरू से अंत तक पूरा करने का समय निकाला!

  - key: user_info.age.takeaway.css2024
    t: >
      CSS Gen Alpha प्रतिभागियों के बीच अच्छा प्रदर्शन नहीं कर रहा है, शायद इसलिए कि वे Fortnite खेलने में व्यस्त हैं। 

      रुकिए, Fortnite अभी भी चल रहा है ना…?

  - key: user_info.years_of_experience.takeaway.css2024
    t: >
      यह चार्ट दिखाता है कि अधिकांश प्रतिभागियों को कभी `float`-आधारित पोज़िशनिंग के साथ काम करने की जरूरत नहीं पड़ी।

  - key: user_info.company_size.takeaway.css2024
    t: >
      कंपनी जितनी बड़ी, वेतन उतना ही अधिक। हालांकि, अगर आप पर्याप्त अच्छे हैं, तो हमारे डेटा से पता चलता है कि आप कंपनी के आकार की परवाह किए बिना अच्छा जीवनयापन कमा सकते हैं।

  - key: user_info.yearly_salary.takeaway.css2024
    t: >
      जबकि अक्सर सिलिकॉन वैली से छह-अंक वाले वेतन की कहानियाँ सुनने को मिलती हैं, वास्तविकता यह है कि दुनिया भर के अधिकांश फ्रंट-एंड डेवलपर्स बहुत कम कमाते हैं, जैसा कि अमेरिका और बाकी दुनिया की तुलना से स्पष्ट होता है।

  - key: user_info.higher_education_degree.takeaway.css2024
    t: >
      जबकि डिग्री होने से आपका वेतन अधिक सुनिश्चित होता है, यह जरूरी नहीं कि यह प्रोग्रामिंग से संबंधित हो – यह हमारे लिए एक अच्छा संकेत है जो जीवन में बाद में वेब डेवलपमेंट के प्रति उत्साह विकसित कर चुके हैं।

  - key: user_info.gender.takeaway.css2024
    t: >
      कनाडा, स्पेन, यू.के., और अमेरिका में महिला प्रतिभागियों का अनुपात सबसे अधिक था। 

      हमारा डेटा यह भी दिखाता है कि महिलाओं की आय अन्य समूहों की तुलना में पीछे है। जबकि इसके पीछे के कारण इस रिपोर्ट के दायरे से बाहर हैं, यह स्पष्ट है कि हमारी इंडस्ट्री में महिलाओं को कुछ अनूठी चुनौतियों का सामना करना पड़ता है।

  - key: user_info.race_ethnicity.takeaway.css2024
    t: >
      गैर-श्वेत प्रतिभागी अधिकतर युवा और कम अनुभव वाले थे – जो उम्मीद है कि उद्योग में विविधीकरण की ओर एक सकारात्मक संकेत है।

  - key: user_info.disability_status.takeaway.css2024
    t: >
      एक्सेसिबिलिटी समर्थकों के निरंतर प्रयासों के लिए धन्यवाद, अब हम मानते हैं कि विकलांगताएँ (स्थायी या अस्थायी) डिजाइन और विकास प्रक्रिया का हिस्सा होनी चाहिए।

  - key: user_info.source.takeaway.css2024
    t: >
      जबकि अधिकांश प्रतिभागियों को सर्वे के बारे में पिछले वर्षों से जानकारी थी, केविन पॉवेल ने भी बड़ी संख्या में प्रतिभागियों को हमारे पास भेजा।

  # features

  - key: features.all_features.takeaway.css2024
    t: >
      फ़िल्टर इफ़ेक्ट्स (`blur()`, `contrast()`, आदि) 2024 का अप्रत्याशित सबसे ज्यादा इस्तेमाल किया गया CSS फीचर रहे, जिनमें 75.4% प्रतिभागियों ने इन्हें इस्तेमाल किया; इसके बाद `:has()` सेलेक्टर था, जिसे 72.8% ने इस्तेमाल किया। 

      भावनाओं के आधार पर रैंकिंग करने पर, Subgrid सबसे पसंदीदा फीचर निकला, जिसमें 51.5% प्रतिभागी इसे फिर से इस्तेमाल करने को तैयार थे। 

      सबसे कम इस्तेमाल किया गया फीचर? कोई और नहीं बल्कि `hanging-punctuation`, जिसमें 84.7% प्रतिभागियों ने इसके बारे में कभी सुना तक नहीं था!

  - key: features.reading_list.takeaway.css2024
    t: >
      रीडिंग लिस्ट आपको सर्वे पूरा होने के बाद उन आइटम्स को सहेजने देती है जिनके बारे में आप और जानना चाहते हैं। 

      इसलिए यह कोई संयोग नहीं है कि सबसे कम ज्ञात फीचर, `hanging-punctuation`, हमारी रीडिंग लिस्ट रैंकिंग में सबसे ऊपर है, क्योंकि इसे डेवलपर्स ने सबसे अधिक सहेजा!

  # tools

  - key: tools.css_frameworks.takeaway.css2024
    t: >
      जब बात CSS फ़्रेमवर्क और UI लाइब्रेरीज़ की आती है, Tailwind CSS अन्य पारंपरिक प्रतियोगियों से काफी आगे अपनी अलग राह बना रहा है।

  - key: tools.css_in_js.takeaway.css2024
    t: >
      जबकि CSS-in-JS का कुछ आकर्षण नए CSS फीचर्स जैसे वेरिएबल्स के कारण अप्रचलित हो सकता है, हाल की नवाचारें जैसे टाइप्ड स्टाइल्स और बिल्ड-टाइम कंपाइलेशन दिखाती हैं कि इस क्षेत्र में अभी भी बहुत संभावनाएँ हैं।

  - key: tools.pre_post_processors.takeaway.css2024
    t: >
      Sass/SCSS यहाँ अभी भी नेता है, लेकिन यह देखना दिलचस्प होगा कि क्या इसका उपयोग स्थिर रहेगा अब जब इसके कई मुख्य फीचर्स CSS में ही शामिल हो चुके हैं।

  - key: tools.utilities.takeaway.css2024
    t: >
      आपके CSS को अपने अनुसार फॉर्मेट, मिनिफाई और अन्य तरीके से एडजस्ट करने के लिए कोई कमी नहीं है।

  - key: tools.browsers.takeaway.css2024
    t: >
      जबकि बड़े चार ब्राउज़र इस चार्ट में हावी हैं, Arc धीरे-धीरे ब्राउज़र रैंकिंग में ऊपर चढ़ रहा है, साल-दर-साल 7.8% से 12% उपयोग तक।

  # usage

  - key: usage.form_factors.takeaway.css2024
    t: >
      एक्सेसिबिलिटी की बढ़ती अहमियत का एक उत्साहजनक संकेत, स्क्रीन रीडर टेस्टिंग साल-दर-साल 16.6% से बढ़कर 19% हो गया है।

  - key: usage.what_do_you_use_css_for.takeaway.css2024
    t: >
      जबकि यह डेटा चौंकाने वाला नहीं है, यह याद दिलाता है कि CSS केवल वेबपेज़ फॉर्मेट करने से कहीं ज्यादा कर सकता है।

  - key: usage.industry_sector.takeaway.css2024
    t: >
      क्या आप जानते हैं कि आप इस सर्वे के डेटा को इंडस्ट्री सेक्टर के हिसाब से फ़िल्टर कर सकते हैं? किसी भी चार्ट पर "Add Filters…" क्लिक करें!

  - key: usage.usage_type.takeaway.css2024
    t: >
      चाहे आप पेशेवर रूप से वेबसाइट बनाएं या बस सीखते रहें, CSS का उपयोग करने का कोई गलत तरीका नहीं है!

  - key: usage.design_methodology.takeaway.css2024
    t: >
      जबकि अधिकांश उत्तरदाता CSS का उपयोग पहले से मौजूद डिज़ाइन को लागू करने के लिए करते हैं, यह दिलचस्प होगा कि क्या यह बदलता है जब डिज़ाइन ऐप्स विकसित होंगे और AI टूल सीधे आइडिया से कोड बनाने में सक्षम होंगे।

  - key: usage.css_js_balance.takeaway.css2024
    t: >
      CSS सर्वे के संदर्भ में भी, अधिकांश उत्तरदाता अभी भी अपना अधिकांश समय JavaScript इकोसिस्टम में बिताते हैं। समय ही बताएगा कि क्या यह अब बदलता है जब CSS अधिक सक्षम हो रहा है।

  - key: usage.css_interoperability_features.takeaway.css2024
    t: >
      यह जानने से बदतर कम ही महसूस होता है कि एक नया फीचर आपकी समस्या को पूरी तरह हल कर सकता है, लेकिन खराब ब्राउज़र सपोर्ट के कारण आप इसका उपयोग नहीं कर सकते।  

      Anchor Positioning, एक आशाजनक नया फीचर, अभी व्यापक रूप से समर्थित नहीं है।  

      दूसरी ओर, Container Queries [एक बेसलाइन स्तर पर उपलब्ध हैं](https://web.dev/blog/cq-stable) और उपयोग के लिए तैयार हैं, जैसा कि कई उत्तरदाताओं ने बताया!

  - key: usage.css_missing_features.takeaway.css2024
    t: >
      किसी जादुई छड़ी के बिना जो हमें किसी भी CSS फीचर को तुरंत उत्पन्न करने दे, हम केवल यही आशा कर सकते हैं कि यह डेटा ब्राउज़र विक्रेताओं को सही दिशा में प्रेरित करेगा!  

      अच्छी खबर: conditional logic, mixins, और masonry layouts सभी किसी न किसी रूप में वर्तमान में विकसित किए जा रहे हैं।

  - key: usage.css_pain_points.takeaway.css2024
    t: >
      जबकि ब्राउज़र सपोर्ट हमेशा से CSS की मुख्य समस्या रही है, Tailwind CSS भी कुछ लोगों के लिए परेशानी का स्रोत साबित हो रहा है – जबकि अन्य शिकायत करते हैं कि इसका पर्याप्त उपयोग नहीं हो रहा!

  - key: usage.favorite_new_features.takeaway.css2024
    t: >
      लंबे समय से प्रतीक्षित फीचर, समझदारी से लागू, अच्छा ब्राउज़र सपोर्ट: `:has()` सब कुछ रखता है, और 2024 के सबसे अच्छे नए CSS फीचर की रैंकिंग में शीर्ष पर है!

  - key: usage.state_of_the_web_happiness.takeaway.css2024
    t: >
      जबकि हमें चीज़ों की स्थिति पर शिकायत करना पसंद है, ऐसा लगता है कि खुशियों का स्तर वर्षों से आश्चर्यजनक रूप से स्थिर बना हुआ है।

  - key: usage.state_of_css_happiness.takeaway.css2024
    t: >
      CSS के मामले में भी हम हल्का बढ़ाव देख रहे हैं, प्रमाण है कि ब्राउज़र विक्रेता, वर्किंग ग्रुप्स, और CSS समुदाय द्वारा किया गया कठिन परिश्रम अनदेखा नहीं हुआ है!

