  ###########################################################################
  # Introduction
  ###########################################################################

  - key: introduction.css2020
    t: |

      <span class="first-letter">C</span>SS के बारे में जो कुछ भी आप जानते हैं उसे भूल जाइए। या कम से कम, इसके कई पहलुओं पर फिर से विचार करने के लिए तैयार रहिए। अगर आप मेरी तरह एक दशक से अधिक समय से CSS लिख रहे हैं, तो 2020 में CSS बिल्कुल वैसा नहीं दिखता जैसा आप पहले जानते थे।  

      ब्रेकपॉइंट्स के बजाय, अब हम CSS Grid का उपयोग करके डायनामिक और रिस्पॉन्सिव लेआउट बना सकते हैं जो किसी भी व्यूपोर्ट साइज़ के अनुसार एडैप्ट हो जाते हैं और कोड की लाइनों की संख्या भी कम रहती है। ग्लोबल स्टाइलशीट्स पर भरोसा करने की बजाय, CSS-in-JS हमें हमारे कंपोनेंट्स के साथ स्टाइल्स को कोलोकेट करने देता है ताकि हम थीम योग्य डिज़ाइन सिस्टम बना सकें।  

      और सबसे बड़ी बात, Tailwind CSS ने वेब डिज़ाइन के दृश्य में जबरदस्त एंट्री की है और अपनी Utility-First CSS के उपयोग के माध्यम से, पारंपरिक सेमांटिक क्लास नामों के नियमों पर फिर से विचार करने के लिए मजबूर किया है।  

      चाहे ये सारी बदलती चीजें आपको एक उत्साही ब्लॉग पोस्ट लिखने के लिए प्रेरित करें या गुस्से भरे ट्विटर रैंट के लिए, हम यहां डेटा प्रस्तुत करने, ट्रेंड्स को उजागर करने और CSS के एक और रोमांचक वर्ष के माध्यम से आपको मार्गदर्शन करने के लिए हैं!  

      ### टीम  

      State of CSS सर्वेक्षण बनाया और बनाए रखा गया है:  

      - [Sacha Greif](https://twitter.com/sachagreif): डिज़ाइन, लेखन, कोडिंग  
      - [Raphaël Benitte](https://twitter.com/benitteraphael): डेटा विश्लेषण, डेटा विज़ुअलाइजेशन  

      ### हमारा डेटा डाउनलोड करें  

      आप [इस सर्वेक्षण के कच्चे JSON डेटा को डाउनलोड कर सकते हैं](https://www.kaggle.com/sachag/state-of-css)। अगर आप अपनी खुद की डेटा विज़ुअलाइजेशन बनाते हैं तो हमें बताइए!  

      ### अन्य लिंक  

      - [State of CSS होमपेज](https://stateofcss.com)  
      - [State of JS](https://stateofjs.com)  

      ### धन्यवाद  

      सर्वेक्षण डिज़ाइन करने में मदद करने वाले सभी लोगों को धन्यवाद, जिनमें शामिल हैं [Chen Hui-Jing](http://chenhuijing.com/), [Philip Jägenstedt](https://blog.foolip.org/), [Adam Argyle](https://nerdy.dev/), [Ahmad Shadeed](https://www.ishadeed.com/), [Robert Flack](https://github.com/flackr), [Dominic Nguyen](https://www.chromatic.com/), [Fantasai](http://fantasai.inkedblade.net/), और [Kilian Valkhof](https://kilianvalkhof.com/)।  

      अतिरिक्त धन्यवाद [Alexey Pyltsyn](https://github.com/lex111) को उनके अनुवाद में मदद के लिए।  

      ### क्रेडिट्स और अन्य  

      यह साइट IBM Plex Mono में सेट की गई है। कोई सवाल? फीडबैक? [संपर्क करें!](mailto:hello@stateofjs.com)  

      और अब, देखते हैं कि इस साल CSS ने क्या किया!  

      <span class="conclusion__byline">– Sacha और Raphaël</span>

  ###########################################################################
  # Tshirt
  ###########################################################################

  - key: sections.tshirt.title
    t: टी-शर्ट

  - key: sections.tshirt.description
    t: |
      ## सर्वेक्षण का समर्थन करें और स्टाइलिश दिखें!  

      सर्वेक्षण के परिणामों से पहले एक त्वरित घोषणा। पेश है हमारा 🎈🎉👕 State of CSS टी-शर्ट 👕🎉🎈!  

      इस शर्ट को विशेष बनाती है कि यह एकमात्र कपड़ा है जो आपको व्यावहारिक, रियल-वर्ल्ड CSS तकनीकें भी सिखाता है।  

      चाहे आप किसी कॉन्फ़्रेंस, नौकरी के इंटरव्यू, या काम पर जा रहे हों, यह शर्ट आपके CSS कौशल को किसी भी अन्य कपड़े की तुलना में बेहतर तरीके से प्रदर्शित करेगी!

  - key: tshirt.about
    t: टी-शर्ट के बारे में

  - key: tshirt.description
    t: |
      शर्ट में State of CSS का लोगो है और साथ ही प्रत्येक आकृति बनाने के लिए इस्तेमाल किए गए वास्तविक CSS कोड के स्निपेट भी शामिल हैं। कौन जानता है, आप कुछ नया सीख सकते हैं!  

      हम उच्च गुणवत्ता वाली, सुपर-सॉफ्ट ट्राइ-ब्लेंड शर्ट का उपयोग करते हैं, जिसमें स्लिम फिट है।  
      यह शर्ट छोटे आकार में आती है, इसलिए अगर आप ढीली फिट पसंद करते हैं तो हम सुझाव देते हैं कि अपने सामान्य आकार से एक आकार बड़ा ऑर्डर करें (मैं तस्वीरों में M पहने हुए हूँ)।

  - key: tshirt.getit
    t: प्राप्त करें

  - key: tshirt.price
    t: USD $24 + शिपिंग

  ###########################################################################
  # Sections Introductions
  ###########################################################################

  - key: sections.user_info.description
    t: |
      इस साल का सर्वेक्षण **11,492** लोगों तक पहुँचा और **102** देशों में शामिल हुआ। इस साल पहली बार,  
      हमने सर्वेक्षण प्रश्नों का अनुवाद कई भाषाओं में किया, एक शानदार स्वयंसेवक टीम की मदद से।

  - key: sections.features.description
    t: |
      हाल के वर्षों में CSS में कई नई सुविधाओं का आगमन हुआ है, इसलिए जैसा कि अपेक्षित था, अपनाने की गति  
      थोड़ी पीछे है क्योंकि समुदाय को नई प्रॉपर्टीज़ को समझने का समय चाहिए।

  - key: sections.units_selectors.description
    t: |
      हम शर्त लगा सकते हैं कि आप इस अनुभाग में कुछ ऐसी चीज़ें पाएंगे जिनके बारे में आप नहीं जानते थे!

  - key: sections.technologies.description
    t: |
      CSS पारिस्थितिकी तंत्र कुछ प्रकार के नवीनीकरण से गुजर रहा है, क्योंकि पुराने प्रमुख जैसे Bootstrap  
      अब Tailwind CSS जैसे नए खिलाड़ियों के अनुकूल होना पड़ रहा है। CSS-in-JS आंदोलन का तो कहना ही क्या,  
      हालांकि यह अभी CSS के मुख्यधारा में पूरी तरह शामिल नहीं हुआ है, यह काफी डायनामिक है।

  - key: sections.other_tools.description
    t: |
      यहां कोई बड़ा आश्चर्य नहीं है, लेकिन यह उल्लेखनीय है कि Polypane और Sizzy जैसे डेवलपमेंट-केंद्रित ब्राउज़रों  
      का आगमन हुआ है, जो पारंपरिक DevTools से एक कदम आगे हैं।

  - key: sections.environments.description
    t: |
      CSS की एक मुख्य ताकत इसकी विभिन्न वातावरणों के अनुसार अनुकूलन क्षमता है, फिर भी कई कारणों से  
      प्रिंट और ईमेल जैसे माध्यम CSS डेवलपर्स के लिए अब तक पर्याप्त रूप से अन्वेषित नहीं हुए हैं।  
      क्या ये CSS की अगली सीमा बन सकते हैं…?

  - key: sections.resources.description
    t: |
      इस अनुभाग में “अन्य उत्तरों” के परिणाम CSS समुदाय की समृद्धि और विविधता को उजागर करते हैं,  
      और कई उत्कृष्ट ब्लॉग और पॉडकास्ट दिखाते हैं जिन्हें हम अगले साल आधिकारिक रूप से सर्वेक्षण में जोड़ने की उम्मीद कर रहे हैं!

  - key: sections.opinions.description
    t: |
      ये राय यह दर्शाती हैं कि भाषा अधिक परिपक्व हो रही है, लेकिन साथ ही जटिल भी। और शायद  
      –कम से कम जब तक हम बदलाव की गति के साथ तालमेल बिठाने की कोशिश कर रहे हैं– थोड़ी कम मजेदार भी?

  ###########################################################################
  # Notes
  ###########################################################################

  - key: blocks.gender.note
    t: |
      यदि आप अधिक जानने में रुचि रखते हैं, तो हमने [एक ब्लॉग पोस्ट](https://dev.to/sachagreif/is-our-survey-biased-against-women-49oj) लिखा है जो सर्वेक्षण के लिंग संबंधी पहलुओं को संबोधित करता है।

  - key: blocks.css_missing_features.note
    t: |
      आप [इस साइड प्रोजेक्ट](https://whatsmissingfromcss.com/) में इस प्रश्न के सभी उत्तरों का पूरा डेटासेट एक्सप्लोर कर सकते हैं।

  - key: blocks.source.note
    t: >

      यह चार्ट रेफेरर्स, URL पैरामीटर्स और फ्रीफॉर्म उत्तरों का मिश्रण है।  

      - State of JS: [State of JS](https://stateofjs.com) मेलिंग लिस्ट।  

      - State of CSS: State of CSS मेलिंग लिस्ट; साथ ही `email`, `by email` आदि से मेल खाता है।  

      - Work: `work`, `colleagues`, `coworkers` आदि से मेल खाता है।

  ###########################################################################
  # Awards
  ###########################################################################

  - key: award.feature_adoption_delta_award.comment
    t: 2020 में **{value}** प्रगति के साथ, यह वह वर्ष था जब CSS Grid नई तकनीक से स्थापित उपकरण में बदल गया।

  - key: award.tool_usage_delta_award.comment
    t: पिछले साल के दौरान Tailwind CSS की नाटकीय **{value}** प्रगति के करीब कोई अन्य उपकरण नहीं आया।

  - key: award.tool_satisfaction_award.comment
    t: PostCSS का **{value}** रिटेंशन रेशियो दिखाता है कि एक चीज़ को बहुत अच्छी तरह करना सबसे अच्छा है।

  - key: award.tool_interest_award.comment
    t: इस साल CSS डेवलपर्स के बीच CSS Modules ने **{value}** अनुपात के साथ सबसे अधिक रुचि उत्पन्न की।

  - key: award.most_write_ins_award.comment
    t: कई प्रश्नों ने भी लिखित उत्तर स्वीकार किए, और **{value}** उल्लेखों के साथ PhpStorm कुल मिलाकर सबसे लोकप्रिय आइटम रहा।

  ###########################################################################
  # Conclusion
  ###########################################################################

  - key: sections.conclusion.description
    t: |
      अगर कोई जावास्क्रिप्ट डेवलपर CSS का एक लाइन कोड लिखता है, तो क्या वह अब CSS डेवलपर बन जाता है?

      यह प्रोग्रामिंग *कोआन* वेब डेवलपमेंट की दुनिया में एक स्पष्ट प्रवृत्ति को दर्शाता है: जैसे-जैसे अधिक CSS डेवलपर्स को जावास्क्रिप्ट सीखने का काम सौंपा जा रहा है, वैसे ही जावास्क्रिप्ट डेवलपर्स यह समझने लगे हैं कि CSS सिर्फ `font-weight: bold;` तक सीमित नहीं है। 

      इसलिए “CSS की स्थिति” के बारे में पूछना स्वाभाविक रूप से एक जटिल प्रश्न है: आप किससे पूछते हैं, उसके आधार पर आपको पूरी तरह से अलग उत्तर मिल सकते हैं! और आप कैसे जानेंगे कि कौन सा सही है?

      यहाँ आपके लिए एक और कोआन है: सही उत्तर यह है कि *कोई सही उत्तर नहीं है।* यहाँ दिखाए गए कई टूल्स, मेथडोलॉजीज़, फ्रेमवर्क्स और लाइब्रेरीज़ का फ्रंट-एंड इकोसिस्टम में अपना महत्व है। 

      एक जटिल React ऐप बना रहे हैं? Styled Components एक शानदार विकल्प है। एक स्थिर लैंडिंग पेज डिज़ाइन कर रहे हैं? Sass के साथ आप गलत नहीं होंगे! और भले ही Bootstrap ने अपनी मूल लोकप्रियता का कुछ हिस्सा खो दिया हो, थीम्स और प्लगइन्स की sheer संख्या में इसे कोई मात नहीं दे सकता।  

      इसलिए जबकि हम GitHub पर हर हफ्ते उभरते नए टूल्स पर नजर रखते हैं, चलिए उन टूल्स, तकनीकों, और सबसे बढ़कर उन लोगों को नहीं भूलते जिन्होंने अब तक CSS का मशाल थामे रखा है। अगर हमें CSS को 2021 और आगे बढ़ाना है, तो हमें हर किसी की जरूरत होगी!

  ###########################################################################
  # Picks
  ###########################################################################

  - key: picks.my_2020_pick
    t: "मेरा 2020 पसंद: "
  - key: picks.intro
    t: हमने CSS समुदाय के सदस्यों से पूछा कि वे “साल की पसंद” क्या चुनेंगे

  - key: picks.shadeed9.bio
    t: debuggingcss.com के लेखक
  - key: picks.shadeed9.description
    t: |
      कंटेनर क्वेरीज हमारे लिए लंबे समय से प्रतीक्षित फीचर हैं, 
      और मैं बहुत खुश हूँ कि Chrome टीम इसे नैटिव रूप से सपोर्ट करने पर काम कर रही है!

  - key: picks.argyleink.bio
    t: Google में CSS
  - key: picks.argyleink.description
    t: |
      साधारण CSS बॉक्स हर साल और अधिक डायनामिक हो रहा है, और मेरे लिए 2020 लॉजिकल साइड्स के बारे में था, न कि फिजिकल साइड्स के। 
      अंतरराष्ट्रीय संदर्भ में मुफ्त कंटेंट फ्लो, spacing और शॉर्टहैंड्स? धन्यवाद!

  - key: picks.sachagreif.bio
    t: इस सर्वेक्षण के निर्माता
  - key: picks.sachagreif.description
    t: |
      इस ब्लॉग पोस्ट के साथ, Amelia Wattenberger ने सिर्फ अतिरिक्त मेहनत नहीं की, उन्होंने पूरी मैराथन दौड़ी! एनिमेशन और क्विज़ यह सुनिश्चित करेंगे कि आप अंततः CSS cascade को समझ लें।

  - key: picks.christianoliff.bio
    t: Trimble MAPS के फ्रंट-एंड डेवलपर
  - key: picks.christianoliff.description
    t: |
      इस साल मैंने वास्तव में जो टूल इस्तेमाल करना और सराहना शुरू की है, वह है Purge CSS – अप्रयुक्त CSS हटाने के लिए शानदार टूल। यह आपके CSS का आकार काफी कम कर सकता है, और तेज़ व आसान है।

  - key: picks.kilianvalkhof.bio
    t: Polypane के वेब डेवलपर और निर्माता
  - key: picks.kilianvalkhof.description
    t: |
      `content-visibility` मेरे वेब एप्स के प्रदर्शन में पहले ही बड़ा अंतर ला रहा है, लेकिन साथ ही मुझे लगता है कि इसे ऑप्टिमाइज़ करना ब्राउज़र का काम होना चाहिए, डेवलपर्स का नहीं।

  - key: picks.walterstephanie.bio
    t: यूज़र सेंट्रिक डिज़ाइनर और CSS प्रेमी
  - key: picks.walterstephanie.description
    t: |
      एक YouTube वीडियो श्रृंखला जो सभी नए शानदार CSS फीचर्स को समझाती है और आधुनिक डिज़ाइन बनाने में मदद करती है।

  - key: picks.piccalilli_.bio
    t: फ्रीलांस डिज़ाइनर और डेवलपर, piccalil.li के संस्थापक
  - key: picks.piccalilli_.description
    t: |
      यह ब्लॉग CSS ज्ञान का एक सचमुच खजाना है। Michelle एक CSS लीजेंड हैं और उनका हर पोस्ट या ट्यूटोरियल उपयोगी सामग्री से भरा है।

  - key: picks.sarasoueidan.bio
    t: स्वतंत्र UI/डिज़ाइन इंजीनियर
  - key: picks.sarasoueidan.description
    t: |
      मेरी पसंद एक व्यक्ति है, यानी Rachel Andrew। उन्होंने पूरी पीढ़ी के डेवलपर्स को CSS Grid सिखाया।

  - key: picks.5t3ph.bio
    t: Microsoft में सॉफ्टवेयर इंजीनियर
  - key: picks.5t3ph.description
    t: |
      इस कॉन्फ़्रेंस टॉक में, Manuel Matuzovic ने सोच-समझकर बनाए गए उदाहरण प्रस्तुत किए हैं, जो आकर्षक, सुलभ और क्रियाशील हैं।

  - key: picks.hugogiraudel.bio
    t: नॉन-बाइनरी एक्सेसिबिलिटी और विविधता समर्थक
  - key: picks.hugogiraudel.description
    t: |
      Fela एक अद्भुत सॉफ्टवेयर है। 
      यह काफी शक्तिशाली, अपेक्षाकृत उपयोग में आसान और बहुत प्रदर्शनकारी है।

  - key: picks.foolip.bio
    t: Google में सॉफ्टवेयर इंजीनियर
  - key: picks.foolip.description
    t: |
      Sergio ने हाल ही में WebKit और कुछ Chromium में Flexbox की कई समस्याओं को ठीक किया, 
      खासकर WebKit में flex gap लाकर, 
      जिसका मतलब है कि जल्द ही यह सभी आधुनिक ब्राउज़र में उपलब्ध होगा।

  - key: picks.jina.bio
    t: डिज़ाइन सिस्टम्स समर्थक और अभ्यासक
  - key: picks.jina.description
    t: |
      मोशन को कम करने के लिए मीडिया क्वेरी, जो चक्कर आने और असुविधा से बचने में मदद करती है।
