locale: hi-IN
translations:
  ###########################################################################
  # General
  ###########################################################################

  - key: general.results.description
    t: CSS इकोसिस्टम में नवीनतम रुझानों के बारे में वार्षिक सर्वेक्षण का 2023 संस्करण।

  - key: general.css2022.js2022_banner
    t: State of JS 2022 सर्वेक्षण वर्तमान में खुला है, आप इसे [अभी पूरा कर सकते हैं](https://survey.devographics.com/survey/state-of-js/2022?source=css2022)!

  - key: general.css2023.results_intro
    t: |
      मैं झूठ नहीं बोलूंगा, हाल ही में CSS के साथ अप-टू-डेट रहना आसान नहीं रहा। सौभाग्य से इस वर्ष [Chen Hui Jing](https://chenhuijing.com/) ने सर्वेक्षण डिज़ाइन प्रक्रिया का नेतृत्व किया, और पिछले साल [Lea Verou](https://lea.verou.me/) द्वारा किए गए काम को आगे बढ़ाया।  

      हमें Google Chrome टीम का समर्थन भी मिला, जो (अन्य ब्राउज़र विक्रेताओं के साथ) इन परिणामों का उपयोग अपने रोडमैप को मार्गदर्शन देने के लिए करती है।  

      इस अतिरिक्त मदद के कारण, हम कई नए फीचर्स पेश करने में सक्षम रहे, सबसे पहले **चार्ट कस्टमाइज़ करने** की सुविधा। चार्ट के पास <span class="customize-chart-icon">“settings”</span> आइकन पर क्लिक करके, आप अब इसे सैलरी, देश, या किसी भी अन्य वैरिएबल के आधार पर फिल्टर कर सकते हैं!  

      तो चलिए देखते हैं कि CSS 2023 में कैसे विकसित हुआ!

  ###########################################################################
  # Introduction
  ###########################################################################

  - key: introduction.css2023
    t: |
      <span class="first-letter">C</span>SS अभूतपूर्व प्रगति के दौर से गुजर रहा है। `:has()`, कंटेनर क्वेरीज़, सबग्रिड और कई अन्य फीचर्स के बीच, नए फीचर्स लगभग हर महीने ब्राउज़रों तक पहुँच रहे हैं।  

      इस सभी विकास का परिणाम यह है कि चीज़ें कभी-कभी थोड़ा अभिभूत करने वाली हो सकती हैं। सौभाग्य से इस वर्ष हमारे पास [Chen Hui Jing](https://chenhuijing.com/) थे, जिन्होंने सर्वेक्षण डिज़ाइन करने और CSS के जंगल में हमारा मार्गदर्शन करने में मदद की।  

      और सर्वेक्षण की बात करें, क्या आप जानते हैं कि ब्राउज़र विक्रेता इस डेटा का उपयोग [Interop](https://web.dev/interop-2023/) पहल के हिस्से के रूप में करते हैं ताकि यह तय किया जा सके कि अगली बार किन फीचर्स पर काम करना है?  

      अंत में, इस वर्ष हम एक नया फीचर पेश कर रहे हैं: आपके अपने डेटा फिल्टर के साथ **चार्ट कस्टमाइज़ करने** की क्षमता। हम उत्सुक हैं कि आप किस तरह की नई अंतर्दृष्टियाँ खोजेंगे!  

      <span class="conclusion__byline">– Sacha Greif</span>

  ###########################################################################
  # Sections Introductions
  ###########################################################################

  - key: sections.user_info.description.css2023
    t: |
      इस वर्ष का सर्वेक्षण दुनिया भर में **9,190** डेवलपर्स तक पहुँचा।

  - key: sections.features.description.css2023
    t: |
      CSS हाल ही में तेज़ी से प्रगति कर रहा है, और कई नए फीचर्स धीरे-धीरे डेवलपर समुदाय द्वारा अपनाए जा रहे हैं।

  - key: sections.css_frameworks.description.css2023
    t: |
      एक बार फिर, Tailwind CSS अलग खड़ा है, वह मुख्य UI फ्रेमवर्क है जिसे डेवलपर्स खुशी-खुशी इस्तेमाल करते हैं; जबकि Open Props एक छोटा लेकिन उत्साही फॉलोइंग बना रहा है।

  - key: sections.css_in_js.description.css2023
    t: |
      प्रारंभिक वृद्धि के बाद, ऐसा लगता है कि CSS-in-JS सेक्टर स्थिर हो गया है, और वास्तविक CSS अपने कई मुख्य लाभों को अपनाने लगा है, जो शायद इसका बड़ा कारण है।

  - key: sections.other_tools.description.css2023
    t: |
      ब्राउज़र के आविष्कार के 30 साल बाद भी इस क्षेत्र में नवाचार जारी है, नए प्रवेशकों जैसे Brave और Arc के साथ; या Polypane जैसे विशेष उपकरण बाजार में हिस्सेदारी हासिल कर रहे हैं।

  - key: sections.usage.description.css2023
    t: |
      आप CSS का उपयोग जिस भी तरीके से करें, डेटा दिखाता है कि यह सुनिश्चित करना कि आपका कोड सभी ब्राउज़रों में काम करे, अभी भी चिंता का विषय है, खासकर नए फीचर्स जैसे `:has()` के लिए।

  - key: sections.resources.description.css2023
    t: |
      ब्लॉग्स, YouTube चैनल्स और पॉडकास्ट के बीच, CSS समुदाय पहले से कहीं अधिक जीवंत है।

