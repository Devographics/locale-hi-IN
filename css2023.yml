  - key: about.content.css2023
    t: >
      2023 की State of CSS सर्वेक्षण 15 जून से 15 जुलाई 2023 तक चला और इसने 9,108 प्रतिक्रियाएँ एकत्र कीं। यह सर्वेक्षण [Devographics](https://www.devographics.com/) द्वारा संचालित किया गया, जिसमें ओपन-सोर्स योगदानकर्ताओं और सलाहकारों की टीम ने मदद की। 

      State of CSS का लोगो और टी-शर्ट [Christopher Kirk-Nielsen](http://chriskirknielsen.com/) द्वारा डिजाइन और एनिमेट किया गया था।  

      ### सर्वेक्षण के लक्ष्य

      यह सर्वेक्षण, [State of JavaScript](https://stateofjs.com/) सर्वेक्षण के साथ, वेब विकास पारिस्थितिकी तंत्र में आगामी रुझानों की पहचान करने के लिए बनाया गया था, ताकि डेवलपर्स तकनीकी विकल्प चुनने में सक्षम हों। 

      इस प्रकार, ये सर्वेक्षण अगले कुछ वर्षों में क्या आने वाला है, इसकी भविष्यवाणी करने पर केंद्रित हैं, न कि वर्तमान में क्या लोकप्रिय है, इसलिए वर्तमान में सबसे व्यापक रूप से इस्तेमाल होने वाली सुविधाएँ या तकनीकें हमेशा शामिल नहीं होती हैं। 

      इसके अतिरिक्त, सर्वेक्षण डेटा का उपयोग ब्राउज़र विक्रेता भी फीचर्स को प्राथमिकता देने और [Interop 2023](https://web.dev/interop-2023/) जैसी पहलों को सूचित करने के लिए करते हैं।  

      ### सर्वेक्षण डिज़ाइन

      इस साल सर्वेक्षण डिज़ाइन का नेतृत्व [Chen Hui Jing](https://chenhuijing.com/) ने किया, Google Chrome टीम द्वारा दिए गए फंडिंग अनुदान के लिए धन्यवाद। सभी सर्वेक्षण प्रश्न वैकल्पिक थे।  

      ### सर्वेक्षण दर्शक

      सर्वेक्षण ऑनलाइन खुला हुआ था और प्रतिभागियों को किसी भी तरह से फ़िल्टर या चयनित नहीं किया गया। प्रतिभागियों में मुख्य रूप से पिछले सर्वेक्षणों के प्रतिभागियों का मिश्रण था (एक समर्पित मेलिंग सूची के माध्यम से सूचित) और सोशल मीडिया ट्रैफ़िक।  

      ### परियोजना फंडिंग

      इस परियोजना की फंडिंग विभिन्न स्रोतों से आती है:

      - **टी-शर्ट बिक्री**।  
      - **प्रायोजित लिंक**: प्रत्येक पृष्ठ के अंत में अनुशंसित संसाधनों के लिंक हमारे साथी [Frontend Masters](https://frontendmasters.com/) द्वारा प्रदान किए जाते हैं।  
      - **प्रायोजित चार्ट**: पिछले साल से, कोई भी अब सीधे $10 या अधिक में किसी चार्ट को प्रायोजित कर सकता है और अपना ट्विटर अवतार उसके पास प्रदर्शित कर सकता है।  
      - **Google**: इस साल, [Google Chrome](https://www.google.com/chrome/) टीम ने सर्वेक्षण डिज़ाइन में मदद करने के लिए Lea को काम पर रखने और मेरे काम का समर्थन करने के लिए बजट रखा।  
      - **Nijibox**: जापान आधारित [Nijibox](https://nijibox.jp/) ने भी मेरी कोशिशों को अधिक टिकाऊ बनाने में मदद करने के लिए प्रायोजन स्वीकार किया।  

      ### तकनीकी अवलोकन

      आप सर्वेक्षणों के संचालन के बारे में अधिक गहन तकनीकी अवलोकन [यहाँ](https://dev.to/sachagreif/how-the-devographics-surveys-are-run-2023-edition-1p6a) पा सकते हैं। हमारा कोड [ओपन-सोर्स](https://github.com/Devographics/Monorepo/) है।  

      ### प्रतिक्रिया

      - [तकनीकी समस्या रिपोर्ट करें](https://github.com/Devographics/Monorepo/issues)  
      - [अगले वर्ष के लिए सुझाव दें](https://github.com/Devographics/surveys/issues/193)  
      - [अन्य गैर-तकनीकी मुद्दे](https://github.com/Devographics/surveys/issues)  
      - [हमारे Discord में शामिल हों](https://discord.gg/tuWRUWVyJs)

  # CSS 2023

  - key: faq.how_long_will_survey_take_css2023
    t: सर्वेक्षण पूरा करने में कितना समय लगेगा?
  - key: faq.how_long_will_survey_take_css2023.description
    t: >
      आप कितने प्रश्नों का उत्तर देते हैं (सभी प्रश्न छोड़ भी सकते हैं) इस पर निर्भर करता है, सर्वेक्षण पूरा करने में लगभग 10-15 मिनट लग सकते हैं।

  - key: faq.learn_more_css2023
    t: मैं और कहाँ जानकारी ले सकता हूँ?
  - key: faq.learn_more_css2023.description
    t: आप इस सर्वेक्षण के बारे में और अधिक [हमारे घोषणा पोस्ट](https://dev.to/sachagreif/the-2023-state-of-css-survey-is-now-open-18bk) में जान सकते हैं।

  - key: faq.survey_design_css2023
    t: यह सर्वेक्षण कैसे डिज़ाइन किया गया?
  - key: faq.survey_design_css2023.description
    t: >
      इस साल, Google के [UI Fund](https://web.dev/ui-fund/) के अनुदान के लिए धन्यवाद, 
      [Chen Hui Jing](https://chenhuijing.com/) सर्वेक्षण के [ओपन डिज़ाइन प्रक्रिया](https://github.com/Devographics/surveys/issues/84) को प्रबंधित करने में मदद कर सके।

  - key: faq.results_released_css2023
    t: परिणाम कब जारी होंगे?
  - key: faq.results_released_css2023.description
    t: सर्वेक्षण 15 जुलाई, 2023 तक चलेगा, और इसके परिणाम आने वाले हफ्तों में जारी किए जाएंगे।

  - key: general.css2023.survey_intro
    t: |
      `:has()`, `@container` और अन्य नई CSS सुविधाओं के साथ अपडेट रहने में मदद करने के लिए, इस साल हम अपनी नई सुविधा पेश कर रहे हैं: **रीडिंग लिस्ट**।  

      सर्वेक्षण भरते समय, आप किसी भी फीचर को बुकमार्क कर सकते हैं और उत्तर देने के बाद उसके बारे में और जान सकते हैं।  

      इस साल [Chen Hui Jing](https://chenhuijing.com/) ने सर्वेक्षण डिज़ाइन प्रक्रिया का नेतृत्व किया, पिछले साल [Lea Verou](https://lea.verou.me/) के काम को आधार बनाते हुए। और जैसा कि हमेशा होता है, यहां आपका फीडबैक ब्राउज़र विक्रेताओं को उनके रोडमैप प्राथमिकता देने और ब्राउज़रों के बीच बेहतर संगतता पर काम करने में महत्वपूर्ण भूमिका निभाएगा।  

      अब जब यह सब स्पष्ट है, आइए देखें कि 2023 में CSS ने अब तक कैसे विकास किया है!
