  - key: user_info.country_low_vs_high_income.description.css2023
    t: >
      उत्तरदाताओं को निम्न-आय और उच्च-आय श्रेणियों में विभाजित करने पर हमें
      दो बिल्कुल अलग देशों की सूचियाँ मिलती हैं।

  - key: user_info.higher_education_degree_by_gender.description.css2023
    t: >
      CSS से संबंधित नहीं क्षेत्रों में उच्च शिक्षा डिप्लोमा रखने वाले उत्तरदाताओं
      में महिलाओं की प्रतिनिधित्व अपेक्षा से अधिक थी, जो संभावित रूप से
      करियर में बदलाव का संकेत देती है।

  - key: user_info.source_by_gender.description.css2023
    t: >
      हालांकि कुल उत्तरदाता कम होने के कारण कोई निश्चित निष्कर्ष निकालना मुश्किल है,
      महिलाओं का अनुपात सबसे अधिक उन उत्तरदाताओं में था
      जो सर्वेक्षण के बारे में अपने कार्यस्थल या दोस्तों-परिवार के माध्यम से पहुंचे थे,
      खासकर उन लोगों की तुलना में जो सोशल नेटवर्क जैसे Twitter या YouTube से आए थे।

  - key: user_info.source_by_race_ethnicity.description.css2023
    t: >
      कम नमूने के आकार को ध्यान में रखते हुए, जब जाति और जातीयता पर विचार किया गया,
      YouTube सर्वेक्षण में ट्रैफ़िक के सबसे विविध स्रोतों में से एक के रूप में उभरा।

  - key: user_info.average_income_by_company_size.description.css2023
    t: >
      सबसे अधिक वेतन पाने वाले उत्तरदाता बड़ी कंपनियों में काम कर रहे हैं, हालांकि
      यह ध्यान देने योग्य है कि अकेले काम करने वाले छोटे कंपनियों की तुलना में थोड़ी आय लाभ दिखाते हैं।

  - key: user_info.yearly_salary_usa_vs_the_world.description.css2023
    t: >
      जब अमेरिका की आय की तुलना बाकी दुनिया से की जाती है, तो यह स्पष्ट होता है कि
      अमेरिकी डेवलपर्स उच्च आय श्रेणियों में अधिक प्रतिनिधित्व करते हैं।

