  - key: picks.kilian_valkhof.bio
    t: वेब डेवलपर और Polypane के निर्माता
  - key: picks.kilian_valkhof.description
    t: |
      2021 में Compat 2021 के रूप में शुरू हुआ, ब्राउज़र इंजन बनाने वालों ने यह तय करना शुरू किया कि वे कौन-से फीचर्स को प्राथमिकता देंगे। 
      यह न केवल ब्राउज़रों के बीच मौजूद विभिन्न फीचर गैप्स को बंद कर रहा है, बल्कि नई फीचर्स जैसे कि @layer को ब्राउज़रों में तेजी से लाने की गति भी बढ़ा रहा है।

