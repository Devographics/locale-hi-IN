  # Awards
  ###########################################################################

  - key: award.feature_adoption_delta_award.comment
    t: |
      Flexbox के लिए `gap` प्रॉपर्टी एक बहुत ही उपयोगी जोड़ है, इसलिए यह आश्चर्य की बात नहीं है कि 2022 में इसे **{value}** प्रगति देखने को मिली।

  # - key: award.tool_usage_delta_award.comment
  #   t: No other tool comes even close to Tailwind CSS's dramatic **{value}** progression over the last year.

  - key: award.most_commented_feature_award.comment
    t: **{value}** टिप्पणियों के साथ, कोई अन्य फीचर Subgrid जितनी प्रतिक्रिया उत्पन्न करने के करीब भी नहीं आया।  

  - key: award.tool_satisfaction_award.comment
    t: |
      सभी CSS-in-JS समाधानों में से, CSS Modules ही एकमात्र ऐसा है जिसने एक
      बेहद उच्च **{value}** रिटेंशन रेशियो बनाए रखा।  

  # - key: award.tool_interest_award.comment
  #   t: With a **{value}** ratio, CSS Modules again generated the most interest among CSS developers this year.

  - key: award.most_write_ins_award.comment
    t: |
      **{value}** उल्लेखों के साथ, Arc ब्राउज़र उन टूल्स में सबसे अधिक बार फ्रीफॉर्म सवालों में उल्लेखित किया गया।  

  ###########################################################################
  # Conclusion
  ###########################################################################

  - key: conclusion.css2022
    t: |
      <span class="first-line">[पिछले साल](https://2021.stateofcss.com/en-US/conclusion/), Kilian ने भविष्यवाणी की थी कि CSS लिखने का तरीका हमेशा के लिए बदलने वाला है, और इस वर्ष के परिणाम उनकी भविष्यवाणी की पुष्टि करते हैं।</span>

      [Interop 2022](https://wpt.fyi/interop-2022) ने ब्राउज़रों को एक साथ लाकर समान लक्ष्यों की ओर काम करने में मदद की, और कई फीचर्स "यह कभी नहीं होगा" से "यह अब हो रहा है" की स्थिति में आ गए। पैरेंट सेलेक्टर्स (`:has()`) और कंटेनर क्वेरीज़ (`@container`) इस श्रेणी के दो बड़े उदाहरण हैं। वर्षों तक डेवलपर्स को यह बताया गया कि ये प्रदर्शन संबंधी कारणों से संभव नहीं हैं, लेकिन यह पता चला कि दोनों संभव हैं।  

      दूसरी ओर, Subgrid हमेशा रोडमैप पर था, बस यह एक बहुत बड़ा काम था। अब इसे Firefox और Safari दोनों द्वारा समर्थित किया गया है, और Chrome में सक्रिय रूप से लागू किया जा रहा है, इसलिए अगले साल हम इसके अधिक व्यापक उपयोग की संभावना देख सकते हैं।  

      मैं भविष्यवाणी करता हूँ कि 2023 के सितारे होंगे नेटिव नेस्टिंग और रंग हेरफेर।  
      नेस्टिंग वर्तमान में [मुख्य कारण](https://twitter.com/leaverou/status/806936438797307904) है कि लोग अभी भी प्रीप्रोसेसर का उपयोग करते हैं, इसलिए इसे नेटिव रूप से उपयोग करना अत्यंत मुक्तिदायक होगा।  

      CSS में रंग के साथ काम करना भी अब और रोमांचक होने वाला है। वर्तमान में कई फीचर्स पूरे बोर्ड पर लागू किए जा रहे हैं। 2023 के अंत तक, हम शायद वाइड गैमट रंग और डिवाइस-स्वतंत्र रंगों (`color()`, `lab()`, `lch()`, `oklab()`, `oklch()`) पर निर्भर रह पाएंगे, और उन्हें `color-mix()` के माध्यम से बुनियादी रूप से बदल सकेंगे।  

      यह सब मिलकर यह दर्शाता है कि 2023 CSS के लिए एक बेहद रोमांचक वर्ष होने वाला है। मैं आने वाले सभी अद्भुत कार्यान्वयनों का इंतजार कर रहा हूँ, चाहे मेरी भविष्यवाणियाँ सही साबित हों या नहीं। CSS लिखने का यह कितना शानदार समय है!  

  - key: conclusion.css2022.bio
    t: W3C तकनीकी आर्किटेक्चर समूह के सदस्य, MIT CSAIL  

