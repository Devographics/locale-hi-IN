  - key: about.content.css2022
    t: >
      2022 के State of CSS सर्वेक्षण का संचालन 1 अक्टूबर से 1 नवंबर 2022 तक किया गया, जिसमें 14,310 प्रतिक्रियाएँ एकत्रित हुईं। इस सर्वेक्षण का संचालन मैंने, [Sacha Greif](https://sachagreif.com/), किया, जिसमें ओपन-सोर्स योगदानकर्ताओं और सलाहकारों की एक टीम ने मदद की।  

      इस साल का लोगो और टी-शर्ट पिछले साल से पुन: उपयोग किया गया, जिसे [Christopher Kirk-Nielsen](http://chriskirknielsen.com/) ने डिज़ाइन और एनिमेट किया था।  

      ### सर्वेक्षण के लक्ष्य

      यह सर्वेक्षण, [State of JavaScript](https://stateofjs.com/) सर्वेक्षण के साथ, वेब विकास इकोसिस्टम में आने वाले रुझानों की पहचान करने के लिए बनाया गया था ताकि डेवलपर्स तकनीकी विकल्पों के बारे में सूचित निर्णय ले सकें।  

      इसलिए, ये सर्वेक्षण वर्तमान में लोकप्रिय तकनीकों का विश्लेषण करने के बजाय आने वाले कुछ वर्षों में क्या आने वाला है, इसे अनुमानित करने पर केंद्रित हैं। यही कारण है कि वर्तमान में सबसे व्यापक रूप से उपयोग की जाने वाली सुविधाएँ या तकनीकें हमेशा शामिल नहीं होती हैं।  

      इसके अतिरिक्त, सर्वेक्षण डेटा का उपयोग ब्राउज़र विक्रेता भी फीचरों को प्राथमिकता देने और [Interop 2022](https://wpt.fyi/interop-2022) जैसी पहलों को सूचित करने के लिए करते हैं।  

      ### सर्वेक्षण डिज़ाइन

      इस वर्ष, सर्वेक्षण डिज़ाइन का नेतृत्व [Lea Verou](https://lea.verou.me/) ने Google Chrome टीम से प्राप्त अनुदान के जरिए किया, और इसे सार्वजनिक रूप से [GitHub](https://github.com/orgs/Devographics/projects/1) पर प्रबंधित किया गया। सभी सर्वेक्षण प्रश्न वैकल्पिक थे।  

      भविष्य में, हम सर्वेक्षण डिज़ाइन, समीक्षा और प्रतिक्रिया को [वर्किंग ग्रुप मेलिंग लिस्ट](https://www.devographics.com/working-group/) के माध्यम से समन्वित भी करेंगे।  

      ### सर्वेक्षण प्रतिभागी

      सर्वेक्षण ऑनलाइन खुले रूप से उपलब्ध था और प्रतिभागियों को किसी भी तरह से फ़िल्टर या चयनित नहीं किया गया। प्रतिभागी मुख्य रूप से पिछले सर्वेक्षणों के उत्तरदाता (समर्पित मेलिंग लिस्ट के माध्यम से सूचित) और सोशल मीडिया ट्रैफ़िक का मिश्रण थे।  

      ### परियोजना वित्तपोषण

      इस परियोजना के वित्तपोषण के स्रोत हैं:

      - **टी-शर्ट बिक्री**।  

      - **प्रायोजित लिंक**: प्रत्येक पृष्ठ के नीचे सुझाए गए संसाधनों के लिंक हमारे साथी [Frontend Masters](https://frontendmasters.com/) द्वारा प्रदान किए जाते हैं।  

      - **प्रायोजित चार्ट**: पिछले साल से, कोई भी अब $10 या उससे अधिक देकर सीधे चार्ट को प्रायोजित कर सकता है, और अपना Twitter अवतार इसके बगल में दिखा सकता है।  

      - **Google**: इस वर्ष, [Google Chrome](https://www.google.com/chrome/) टीम ने Lea को सर्वेक्षण डिज़ाइन में मदद करने के लिए बजट निर्धारित किया, साथ ही मेरे काम को सीधे समर्थन देने के लिए वित्तपोषित किया।  

      - **Nijibox**: जापान आधारित [Nijibox](https://nijibox.jp/) ने भी मेरी कोशिशों को समर्थन देने के लिए उदारतापूर्वक प्रायोजन किया ताकि ये वार्षिक सर्वेक्षण अधिक सतत बन सकें।  

      ### तकनीकी अवलोकन

      आप देख सकते हैं कि सर्वेक्षण कैसे चलाए जाते हैं, इसके बारे में एक गहन तकनीकी अवलोकन [यहाँ](https://dev.to/sachagreif/how-the-state-of-js-css-surveys-are-run-4lnb) उपलब्ध है। हमारा कोड [ओपन-सोर्स](https://github.com/Devographics/Monorepo/) है।  

      - **डेटा संग्रह**: [Next.js](https://nextjs.org/) ऐप, [Vercel](https://vercel.com/) पर चल रहा।  
      - **डेटा स्टोरेज/प्रोसेसिंग**: MongoDB & MongoDB Aggregations, [MongoDB Atlas](https://cloud.mongodb.com/) पर।  
      - **डेटा API**: Node.js GraphQL API, [Render](https://render.com/) पर चल रहा।  
      - **रिजल्ट्स साइट**: [Gatsby](https://www.gatsbyjs.com/) React ऐप, [Netlify](https://netlify.com/) पर।  
      - **डेटा विज़ुअलाइज़ेशन**: [Nivo](https://nivo.rocks/) React डाटा विज़ लाइब्रेरी।  
      - **टाइप**: [IBM Plex Mono](https://fonts.google.com/specimen/IBM+Plex+Mono) और [Bebas Neue](https://fonts.google.com/specimen/Bebas+Neue)।  

      ### फीडबैक

      - [तकनीकी समस्या रिपोर्ट करें](https://github.com/Devographics/Monorepo/issues)  
      - [अगले वर्ष के लिए सुझाव दें](https://github.com/Devographics/surveys/issues/66)  
      - [अन्य गैर-तकनीकी मुद्दे](https://github.com/Devographics/surveys/issues)  
      - [हमारे Discord में शामिल हों](https://discord.gg/tuWRUWVyJs)  
      - भविष्य के सर्वेक्षणों के डिज़ाइन और समीक्षा में भाग लेने के लिए [Devographics Working Group](https://www.devographics.com/working-group/) में शामिल हों।  

