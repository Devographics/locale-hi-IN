  # CSS 2022

  - key: faq.learn_more_css2022
    t: मैं और अधिक कहाँ सीख सकता हूँ?
  - key: faq.learn_more_css2022.description
    t: आप [पिछले वर्ष का सर्वेक्षण यहाँ](https://2021.stateofcss.com/en-US/about/) देख सकते हैं।  

  - key: faq.survey_design_css2022
    t: यह सर्वेक्षण कैसे डिज़ाइन किया गया?
  - key: faq.survey_design_css2022.description
    t: इस वर्ष, Google के [UI Fund](https://web.dev/ui-fund/) से अनुदान के कारण, [Lea Verou](https://lea.verou.me/) नेतृत्व कर सकीं और [GitHub पर ओपन सर्वेक्षण डिज़ाइन प्रक्रिया](https://github.com/orgs/Devographics/projects/1/views/1) का प्रबंधन किया।  

  - key: faq.results_released_css2022
    t: परिणाम कब जारी किए जाएंगे?
  - key: faq.results_released_css2022.description
    t: सर्वेक्षण अक्टूबर 2022 के अंत तक चलेगा, और इसके परिणाम नवंबर की शुरुआत में जारी किए जाएंगे।  

  - key: faq.data_used_css2022
    t: इस डेटा का उपयोग कैसे किया जाएगा?
  - key: faq.data_used_css2022.description
    t: एकत्र किया गया सभी डेटा सार्वजनिक रूप से जारी किया जाएगा। इसके बाद यह डेवलपर्स के लिए एक संसाधन बन जाएगा, जो इसे अपने तकनीकी विकल्पों को सूचित करने के लिए देखेंगे, और ब्राउज़र विक्रेताओं के लिए, जो इसे प्राथमिकता क्षेत्रों को निर्धारित करने और अपने रोडमैप्स को सूचित करने के लिए उपयोग करेंगे।  

  - key: general.css2022.survey_intro
    t: |
      CSS अभूतपूर्व गति से प्रगति कर रहा है। सौभाग्य से इस वर्ष हमें इन सभी परिवर्तनों के सबसे आगे के व्यक्ति से मदद मिली: [Lea Verou](https://lea.verou.me/) ने इस वर्ष के प्रश्नों का चयन किया, जिसमें नए और आगामी CSS फीचरों को उजागर करने पर विशेष ध्यान दिया गया।  

      इसके अलावा, सर्वेक्षण परिणाम ब्राउज़र विक्रेताओं को उनके रोडमैप्स को प्राथमिकता देने और ब्राउज़रों के बीच बेहतर संगतता की दिशा में काम करने में भी मदद करेंगे।  

      तो चलिए देखते हैं कि CSS 2022 में कैसे विकसित हुआ!
