      और यह जितना लगता है उससे कहीं अधिक उपयोगी है। 
      हम इसे Tailwind CSS में हमेशा उपयोग करते हैं ताकि किसी एक CSS प्रॉपर्टी को 
      कई क्लासेस में विभाजित करना संभव हो सके।  

