locale: hi-IN
translations: ###########################################################################
  # General
  ###########################################################################

  - key: general.results.description
    t: CSS इकोसिस्टम में नवीनतम रुझानों के बारे में वार्षिक सर्वेक्षण का 2022 संस्करण।

  - key: general.css2022.js2022_banner
    t: State of JS 2022 सर्वेक्षण वर्तमान में खुला है, आप इसे [अभी ले सकते हैं](https://survey.devographics.com/survey/state-of-js/2022?source=css2022)!

  - key: general.css2022.results_intro
    t: |
      CSS अभूतपूर्व गति से प्रगति कर रहा है। हम केवल नई सुविधाएँ और प्रॉपर्टीज़ ही नहीं देख रहे हैं, बल्कि भाषा की नींव को भी पुनः तैयार और सुधार किया जा रहा है, जैसे कि नेस्टिंग और कैस्केड लेयर्स जैसी नवाचारों के कारण।  

      सौभाग्य से, इस वर्ष हमें इन सभी परिवर्तनों के अग्रिम पंक्ति में किसी से मदद मिली: W3C कार्य समूह की सदस्य [Lea Verou](https://lea.verou.me/) ने इस वर्ष के सर्वेक्षण प्रश्न चुने हैं, विशेष रूप से नए और आने वाले CSS फीचर्स को उजागर करने पर ध्यान केंद्रित करते हुए।  

      इसके अलावा, सर्वेक्षण के परिणाम ब्राउज़र विक्रेताओं को उनके रोडमैप को प्राथमिकता देने और ब्राउज़रों के बीच बेहतर संगतता के लिए काम करने में मदद करेंगे।  

      अब जब यह सब स्पष्ट हो गया है, तो आइए देखें कि 2022 में CSS कैसे विकसित हुआ!

  ###########################################################################
  # Introduction
  ###########################################################################
  - key: introduction.css2022
    t: |
      <span class="first-letter">W</span>ह हमने सोचा था कि CSS पहले ही एक काफी मजबूत भाषा में विकसित हो चुका है, Flexbox, Grid और CSS Variables जैसी प्रगतियों के लिए धन्यवाद। लेकिन ऐसा लगता है कि यह अभी तक इसका अंतिम रूप नहीं था।  

      पैरेंट सेलेक्टर, नेटिव नेस्टिंग, कंटेनर क्वेरीज़, कैस्केड लेयर्स… आने वाली अत्यंत क्रांतिकारी सुविधाओं की सूची सोचने पर ही चौंकाने वाली है।  

      सौभाग्य से, हमारे पास इन waters को नेविगेट करने में मदद करने के लिए सबसे अच्छा गाइड है: [Lea Verou](http://lea.verou.me/) ने इस वर्ष के सर्वेक्षण डिज़ाइन में नेतृत्व लिया है, और परिणामस्वरूप एक ऐसा सर्वेक्षण तैयार हुआ है जो उम्मीद है कि आपको सभी प्रमुख नवाचारों का ज्ञान देगा।  

      <span class="conclusion__byline">– साचा ग्रेफ</span>  

      P.S. इस वर्ष की नई बात: हमने प्रतिभागियों को सर्वेक्षण में उल्लिखित किसी भी फीचर या लाइब्रेरी पर **टिप्पणी छोड़ने** की सुविधा दी! सुनिश्चित करें कि आप प्रत्येक चार्ट के साइडबार में इन टिप्पणियों को देखें।

