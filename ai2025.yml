  # FAQ/About
  ###########################################################################

  - key: about.content.ai2025
    t: |
      2025 का “State of Web Dev AI” सर्वेक्षण 10 फरवरी से 10 मार्च 2025 तक चला और इसमें कुल 4,181 प्रतिक्रियाएँ एकत्रित की गईं। परिणाम 15 अप्रैल 2025 को प्रकाशित किए गए। यह सर्वेक्षण [Devographics](https://devographics.com/) द्वारा संचालित किया गया था, जिसमें आमंत्रित विशेषज्ञों और ओपन-सोर्स योगदानकर्ताओं की सहायता शामिल थी। 

      ### सर्वेक्षण के लक्ष्य

      यह सर्वेक्षण वेब डेवलपमेंट में AI के उपयोग से संबंधित उभरते रुझानों की पहचान करने के लिए बनाया गया था, ताकि डेवलपर्स बेहतर तकनीकी निर्णय ले सकें। 

      ### सर्वेक्षण डिज़ाइन

      सर्वेक्षण को समुदाय के सहयोग से तैयार किया गया था, जिसमें एक ओपन फीडबैक अवधि शामिल थी, जहाँ सर्वेक्षण की रूपरेखा पर [GitHub](https://github.com/Devographics/surveys/issues/278) पर चर्चा की गई। 

      सभी सर्वेक्षण प्रश्न वैकल्पिक थे। 

      ### सर्वेक्षण का श्रोतागण

      यह सर्वेक्षण ऑनलाइन स्वतंत्र रूप से सुलभ था और उत्तरदाताओं को किसी भी प्रकार से फ़िल्टर या चयनित नहीं किया गया था। उत्तरदाता मुख्य रूप से पिछले Devographics सर्वेक्षणों जैसे [State of JS](https://stateofjs.com/), [State of CSS](https://stateofcss.com/) आदि के प्रतिभागियों (जो एक समर्पित मेलिंग सूची के माध्यम से सूचित किए गए थे) और सोशल मीडिया ट्रैफ़िक का मिश्रण थे। 

      यद्यपि सर्वेक्षण सभी डेवलपर्स के लिए खुला था (चाहे वे AI का उपयोग करते हों या नहीं), लेकिन सर्वेक्षण का विषय स्वयं AI में रुचि रखने वाले डेवलपर्स की ओर एक स्वाभाविक झुकाव उत्पन्न करता है। 

      इसलिए इसे **डेवलपर्स के एक विशिष्ट समूह की झलक** के रूप में देखा जाना चाहिए, न कि पूरे इकोसिस्टम के प्रतिनिधि के रूप में। 

      ### परियोजना वित्तपोषण

      इस परियोजना के लिए धन हमारे भागीदारों से प्राप्त प्रायोजनों से आता है।

      किसी भी प्रकार का योगदान या प्रायोजन अत्यधिक सराहनीय है। हम विशेष रूप से अधिक ब्राउज़र विक्रेताओं के साथ घनिष्ठ सहयोग करना चाहेंगे, क्योंकि वे वेब इकोसिस्टम में केंद्रीय भूमिका निभाते हैं।  

      ### तकनीकी अवलोकन

      आप यह जानने के लिए कि सर्वेक्षण कैसे चलाए जाते हैं, [यहाँ](https://dev.to/sachagreif/how-the-devographics-surveys-are-run-2023-edition-1p6a) विस्तृत तकनीकी अवलोकन पढ़ सकते हैं।
