locale: hi-IN
translations:
  - key: general.ai2025.devs2025_banner
    t: >
      कोड के अलावा हर चीज़ के लिए एक नए डेवलपर सर्वेक्षण की घोषणा: स्वास्थ्य, शौक, करियर, और भी बहुत कुछ! →

  - key: general.ai2025.survey_intro
    t: |

      मैंने ChatGPT से इस सर्वेक्षण की प्रस्तावना लिखने को कहा — इसे वास्तव में इस्तेमाल करने के लिए नहीं, बस प्रेरणा के लिए। 

      वह प्रस्तावना शानदार थी — संक्षिप्त, स्पष्ट और अच्छी तरह से सोची-समझी। और अब समस्या यह है कि मैं अपनी कमजोर मानव बुद्धि से उतनी ही अच्छी चीज़ लिखने में संघर्ष कर रहा हूँ। 

      किसी तरह मैंने इस बार कॉपी-पेस्ट करने की इच्छा को रोक लिया। लेकिन जब बात वेब डेवलपमेंट की आती है, तो हममें से कई पहले ही अपने नए AI मालिकों को अपना चुके हैं और नाश्ते से पहले पूरी ऐप्स जनरेट कर लेते हैं — कम से कम अगर मेरे सोशल मीडिया फीड्स पर भरोसा किया जाए तो।

      लेकिन आज मैं यह जानना चाहता हूँ कि *वास्तव में* क्या हो रहा है। आप AI का उपयोग कैसे करते हैं? आपने कौन से टूल आज़माए हैं? और क्या रोबोट्स का विद्रोह GTA 6 आने से पहले होगा?

      हम आपके समय और सुझावों की सराहना करते हैं, और परिणामों को समुदाय के साथ साझा करने के लिए उत्सुक हैं। आइए साथ मिलकर यह खोजें कि AI वेब डेवलपमेंट के भविष्य को कैसे आकार दे रहा है!

      *पुनश्च: ऊपर दिए गए अनुच्छेदों में से एक वास्तव में AI द्वारा लिखा गया है। क्या आप बता सकते हैं कौन सा?*

  - key: introduction.ai2025
    t: |

      क्या झपकी लेने से जेटलैग में मदद मिलती है? मुझे कौन सा सोल्डरिंग आयरन खरीदना चाहिए? आज रात मुझे कहाँ खाना चाहिए? 

      बहुतों की तरह, मैंने भी जीवन के छोटे — और कभी-कभी इतने छोटे नहीं — सवाल AI से पूछना शुरू कर दिया है। लेकिन *कोड लिखने* के बारे में क्या? क्या AI यह संभालने के लिए तैयार है, या हमें अपनी कीबोर्ड्स को थोड़ी देर और पकड़े रहना चाहिए?

      अब अपना पसंदीदा सोशल मीडिया ऐप खोलिए, और आपको डेवलपर्स की कोई कमी नहीं मिलेगी जो आपको बताएंगे कि वे कैसे नाश्ते से पहले पूरी ऐप “वाइब कोड” कर लेते हैं। 

      फिर भी कई सवाल बाकी हैं: 

      - डेवलपर्स AI पर कितना खर्च कर रहे हैं? 
      - कौन से टूल सबसे उपयोगी हैं? 
      - और वेब ऐप्स को विकसित करने में AI का लाभ उठाते समय डेवलपर्स की सबसे बड़ी मुश्किलें क्या हैं?

      यह पहला **State of Web Dev AI** सर्वेक्षण इन सभी सवालों और बहुत कुछ का जवाब देता है। साथ ही, हमने उन डेवलपर्स से भी प्रतिक्रिया लेने की कोशिश की है जो अभी भी AI के प्रति संकोच रखते हैं, ताकि वर्तमान AI इकोसिस्टम की एक सटीक तस्वीर बनाई जा सके।

      हमें उम्मीद है कि आपको यह रिपोर्ट उतनी ही रोचक लगेगी जितनी हमें लगी!

      *ध्यान दें कि यह सर्वेक्षण [The State of AI Report](https://www.stateof.ai/) या [Vercel State of AI survey](https://vercel.com/state-of-ai) से संबद्ध नहीं है।*

      <span class="conclusion__byline">– साचा ग्रेफ</span>

  # FAQ

  - key: faq.results_released_ai2025
    t: परिणाम कब जारी किए जाएंगे?
  - key: faq.results_released_ai2025.description
    t: सर्वेक्षण 10 फरवरी से 10 मार्च, 2025 तक चलेगा, और परिणाम जल्द ही उसके बाद जारी किए जाएंगे।

  - key: faq.survey_design_ai2025
    t: यह सर्वेक्षण कैसे तैयार किया गया था?
  - key: faq.survey_design_ai2025.description
    t: >
      यह सर्वेक्षण [ओपन डिज़ाइन प्रक्रिया](https://github.com/Devographics/surveys/issues/278) के तहत तैयार किया गया था, जिसमें AI कंपनियाँ, ब्राउज़र विक्रेता और वेब डेवलपमेंट समुदाय शामिल थे।

  ###########################################################################
  # Content
  ###########################################################################

  # user_info

  - key: sections.user_info.description.ai2025
    t: |
      **4,181** प्रतिभागियों ने इस पहले "State of Web Dev AI" सर्वेक्षण में भाग लिया।

  # models

  - key: sections.models.description.ai2025
    t: |
      वह नींव जिस पर पूरा इकोसिस्टम टिका है।

  - key: tools.models_experience.takeaway.ai2025
    t: |
      यह कोई आश्चर्य नहीं कि OpenAI का **ChatGPT** अभी भी अपने शुरुआती लाभ और व्यापक पहचान का फायदा उठा रहा है, जिससे यह सबसे ज़्यादा उपयोग किया जाने वाला (91.2%) और सबसे पसंदीदा (53.1%) मॉडल प्रदाता बना हुआ है। 

      हालांकि उपयोग के मामले में इसका बड़ा बढ़त है, **Claude** भी सकारात्मक प्रतिक्रिया (45.9%) में बहुत पीछे नहीं है।

  - key: ai_pain_points.models_pain_points.takeaway.ai2025
    t: |
      **भ्रम और गलतियाँ (Hallucinations & inaccuracies)** अब तक AI मॉडलों की सबसे बड़ी समस्या रहीं, जो समझ में आता है क्योंकि यदि इनका आउटपुट भरोसेमंद न हो तो इनका कोई उपयोग नहीं। 

      **बड़े संदर्भों (contexts)** को संभालने और डेटा को याद रखने में असमर्थता भी एक बड़ी समस्या रही, खासकर बड़े वास्तविक कोडबेस के साथ काम करते समय।

  # ides

  - key: sections.ides.description.ai2025
    t: |
      कल के AI-संचालित टेक्स्ट एडिटर्स।

  - key: tools.ides_experience.takeaway.ai2025
    t: |
      **Cursor** ने 82.2% की पहचान दर के साथ अग्रणी स्थिति बनाई है, जबकि दूसरे स्थान पर Zed केवल 54.1% पर है। 

      Cursor के बारे में छोड़ी गई टिप्पणियों में मुख्य शिकायत इसकी कीमत थी, जो यह दर्शाती है कि बाज़ार में सस्ते विकल्पों की गुंजाइश है।

  - key: ai_pain_points.ides_pain_points.takeaway.ai2025
    t: |
      **संदर्भ और मेमोरी सीमाएँ** वर्तमान में वेब डेवलपर्स को AI IDEs से कोड लिखने से रोकने वाला प्रमुख कारण है, इसके बाद आती हैं **बहुत अधिक हस्तक्षेपकारी सुझाव** और **उच्च लागत** की समस्याएँ।

  # coding_assistants

  - key: sections.coding_assistants.description.ai2025
    t: |
      आपका निजी कोडिंग साथी।

  - key: tools.coding_assistants_experience.takeaway.ai2025
    t: |
      यह कोई आश्चर्य नहीं कि **GitHub Copilot** उपयोग और सकारात्मक भावना दोनों में शीर्ष पर है, लेकिन यह ध्यान देने योग्य है कि **Supermaven** उपयोग में चौथे स्थान पर होने के बावजूद सकारात्मक भावना में दूसरे स्थान पर है। ऐसा अंतर अक्सर किसी उभरते सितारे का संकेत होता है जो आने वाले वर्ष में बड़ा प्रभाव डाल सकता है।

  - key: ai_pain_points.coding_assistants_pain_points.takeaway.ai2025
    t: |
      एक बार फिर **भ्रम और गलतियाँ** व्यापक अपनाने में बड़ी बाधा साबित हुईं।

      और IDEs की तरह ही, कोडिंग असिस्टेंट्स की **सीमित संदर्भ विंडो** भी एक बड़ी समस्या रही।

  # code_generation

  - key: sections.code_generation.description.ai2025
    aliasFor: sections.code_generation.prompt

  - key: tools.code_generation_experience.takeaway.ai2025
    t: |
      Vercel के समर्थन के साथ, **v0** ने इस उभरते उद्योग क्षेत्र में तेज़ी से खुद को नेता के रूप में स्थापित किया है। लेकिन StackBlitz का **Bolt** भी बहुत पीछे नहीं है, और उस पर नज़र रखना निश्चित रूप से सार्थक है।

  - key: ai_pain_points.code_generation_pain_points.takeaway.ai2025
    t: |
      कोड जनरेशन टूल्स अक्सर **खराब गुणवत्ता वाला कोड** बनाते हैं जो या तो इच्छानुसार काम नहीं करता, या बिल्कुल नहीं करता।

  # other_tools

  - key: sections.other_tools.description.ai2025
    t: अन्य AI टूल्स

  - key: other_tools.ai_programming_languages.takeaway.ai2025
    t: |
      जैसा कि एक वेब डेवलपमेंट-केंद्रित सर्वेक्षण से अपेक्षित है, AI टूल्स का सबसे अधिक उपयोग JavaScript और TypeScript के साथ किया गया।

  - key: other_tools.image_generation.takeaway.ai2025
    t: |
      ChatGPT में एकीकृत होने से **Dall-E** को बड़ा लाभ मिला है, जिससे उसने **Stable Diffusion** और **Midjourney** जैसे स्थापित प्रतिद्वंद्वियों को पीछे छोड़ दिया है।

  - key: other_tools.ai_libraries_sdks.takeaway.ai2025
    t: |
      v0 और **Vercel AI SDK** के बीच, Vercel ने AI क्षेत्र में अच्छा प्रदर्शन किया है, भले ही AI उसका मुख्य फोकस न हो।

  - key: other_tools.ai_browser_apis.takeaway.ai2025
    t: |
      भविष्य में AI मॉडल्स सीधे वेब ब्राउज़रों में समाहित हो सकते हैं — और यदि ऐसा होता है, तो अनुवाद या सारांश जैसी चीजें केवल एक API कॉल की दूरी पर होंगी।

  # usage

  - key: sections.usage.description.ai2025
    t: |
      डेवलपर्स AI का उपयोग कैसे करते हैं।

  - key: usage.ai_uses.takeaway.ai2025
    t: जैसा कि डेवलपर सर्वेक्षण में अपेक्षित था, **कोड जनरेशन** AI के सबसे सामान्य उपयोग के रूप में शीर्ष पर रहा। दूसरी ओर, भले ही **इमेज जनरेशन** जेनरेटिव AI का मूल उपयोग मामला था, केवल 38% प्रतिभागियों ने बताया कि वे इसका उपयोग करते हैं।

  - key: usage.ai_generated_code_balance.takeaway.ai2025
    t: हममें से अधिकांश अभी तक “वाइब कोडिंग” नहीं कर रहे हैं — अधिकांश प्रतिभागियों (69%) ने बताया कि वे अपने कोड का 25% से कम हिस्सा AI से जनरेट करते हैं, और केवल एक छोटी संख्या (8%) ने 75% से अधिक कोड AI से जनरेट करने की बात कही।

  - key: usage.ai_generated_code_refactoring.takeaway.ai2025
    t: भले ही कोड जनरेशन के लिए AI का उपयोग किया जाए, अधिकांश डेवलपर्स (76%) ने बताया कि उन्हें आउटपुट को उपयोगी बनाने से पहले कम से कम आधे कोड को रिफैक्टर करना पड़ता है।

  - key: usage.ai_code_refactoring_reasons.takeaway.ai2025
    t: |
      रिफैक्टरिंग के प्रमुख कारण सौंदर्य-संबंधी थे, जैसे खराब पठनीयता, वेरिएबल नाम बदलना, और अत्यधिक दोहराव। 

      कई प्रतिभागियों ने यह भी उल्लेख किया कि जनरेटेड कोड अक्सर इच्छानुसार काम नहीं करता।

  - key: usage.ai_code_generation_frequency.takeaway.ai2025
    t: |
      यह चार्ट दिखाता है कि AI हमारे दैनिक कार्यप्रवाह में कितना समाहित हो चुका है — 46% प्रतिभागी दिन में कई बार या उससे अधिक बार कोड जनरेट करने के लिए AI का उपयोग करते हैं।

  - key: usage.ai_other_tasks_frequency.takeaway.ai2025
    t: |
      कोड जनरेशन की तुलना में, अन्य कार्यों (शोध, सारांश, अनुवाद आदि) के लिए AI का उपयोग अपेक्षाकृत कम होता है — जो समझ में आता है क्योंकि कोडिंग में हम सबसे अधिक समय बिताते हैं।

  - key: usage.ai_generated_code_type.takeaway.ai2025
    t: |
      सबसे अधिक जनरेट किया जाने वाला कोड प्रकार हेल्पर फंक्शंस था, उसके बाद फ्रंटएंड कंपोनेंट्स — दोनों ही अपेक्षाकृत स्वतंत्र होते हैं, जिससे वे कोड जनरेशन के लिए अच्छे उम्मीदवार बनते हैं। 

      कई डेवलपर्स मौजूदा कोड में दस्तावेज़ीकरण या टिप्पणियाँ जोड़ने के लिए भी AI का उपयोग कर रहे हैं, जो एक अप्रत्याशित उपयोग मामला है।

  - key: usage.ai_personal_expenses.takeaway.ai2025
    t: |
      यह स्पष्ट नहीं कि AI कंपनियाँ अपने सर्वर फार्म चलाने के लिए धन कहाँ से ला रही हैं, लेकिन एक बात निश्चित है — यह व्यक्तिगत डेवलपर्स से नहीं आ रहा है, क्योंकि अधिकांश प्रतिभागी वर्तमान में AI टूल्स और सेवाओं पर अपना पैसा खर्च नहीं कर रहे हैं।

  - key: usage.ai_company_expenses.takeaway.ai2025
    t: |
      दिलचस्प बात यह है कि कंपनी का खर्च "घोड़े की नाल" पैटर्न का अनुसरण करता है — या तो वे AI पर कुछ भी खर्च नहीं करतीं, या फिर $5000 से अधिक खर्च करती हैं! यह देखना बाकी है कि क्या यह मूल्य निर्धारण मॉडल AI कंपनियों के लिए टिकाऊ साबित होगा।

      प्रतिभागियों ने यह भी उल्लेख किया कि उन्हें हमेशा इस जानकारी तक पहुंच नहीं होती।

  - key: usage.industry_sector.takeaway.ai2025
    t: |
      किसी भी *अन्य* चार्ट पर हमारे अंतर्निहित **Query Builder** का उपयोग करने में संकोच न करें ताकि इन सर्वेक्षण परिणामों को किसी विशिष्ट उद्योग क्षेत्र के अनुसार फ़िल्टर किया जा सके।

  - key: usage.ai_running_locally.takeaway.ai2025
    t: |
      कई प्रतिभागियों ने पहले ही कठिनाइयों के बावजूद अपने स्वयं के AI मॉडल्स को स्थानीय रूप से चलाने की कोशिश की है, और कई अन्य इसमें रुचि रखते हैं। 

      यह नए मॉडलों के लिए एक प्रमुख विभेदक साबित हो सकता है, क्योंकि यह दर्शाता है कि उपयोगकर्ता अपने AI टूल्स पर अधिक नियंत्रण रखने की प्रबल इच्छा रखते हैं।

  - key: usage.ai_pain_points.takeaway.ai2025
    t: |
      AI से संबंधित समस्याओं में, **कुल मिलाकर कोड की खराब गुणवत्ता** को शीर्ष स्थान मिला।

  - key: usage.ai_missing_features.takeaway.ai2025
    t: |
      आज के मॉडलों में सबसे बड़ी कमी यह है कि वे पूरे कोडबेस को मेमोरी में बनाए रखने में सक्षम नहीं हैं — यदि AI टूल्स का उपयोग केवल प्रोटोटाइपिंग के बजाय एप्लिकेशन के रखरखाव में भी किया जाना है, तो यह क्षमता अत्यंत आवश्यक होगी।

  - key: usage.ai_happiness.takeaway.ai2025
    t: |
      सर्वेक्षण द्वारा उजागर विभिन्न समस्याओं के बावजूद, प्रतिभागियों का समग्र दृष्टिकोण 2025 में वेब डेवलपमेंट के लिए AI की स्थिति को लेकर काफी सकारात्मक था।
    aliases:
      - happiness.ai_happiness.takeaway.ai2025

