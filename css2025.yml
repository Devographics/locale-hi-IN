  - key: features.features_intro_css2025
    aliasFor: features.features_intro_css2024

  ###########################################################################
  # Sections Introductions
  ###########################################################################

  - key: sections.user_info.description.css2025
    t: |
      इस साल के सर्वे ने दुनिया भर में **5,506** डेवलपर्स तक पहुंच बनाई।

  - key: sections.features.description.css2025
    t: |
      यह कोई रहस्य नहीं है कि CSS रिकॉर्ड गति से नई सुविधाएँ जोड़ रहा है – यही वजह है कि इस साल हमने इनमें से कम से कम *50* सुविधाओं के बारे में सवाल किया!

  - key: sections.tools.css2025
    t: लाइब्रेरी और टूल्स

  - key: sections.tools.description.css2025
    t: |
      CSS की नई सुविधाओं द्वारा खोली गई कई क्षमताओं के बावजूद, डेवलपर्स अभी भी अपने वर्कफ़्लो का समर्थन करने के लिए टूलिंग और लाइब्रेरी पर भरोसा करते हैं, कम से कम फिलहाल के लिए।

  - key: sections.usage.description.css2025
    t: |
      आप CSS का उपयोग जैसे भी करें, डेटा यह दिखाता है कि यह सुनिश्चित करना कि आपका कोड सभी ब्राउज़रों में काम करता है, अभी भी एक चिंता का विषय है, विशेष रूप से नई सुविधाओं जैसे `:has()` के लिए।

  - key: sections.resources.description.css2025
    t: |
      निश्चिंत रहें: CSS की नई सुविधाओं की इतनी अधिक संख्या के साथ, हमारे पास CSS ब्लॉग पोस्ट, पॉडकास्ट, वीडियो और कोर्स के लिए सामग्री की कमी कभी नहीं होगी!

  ###########################################################################
  # Takeaways
  ###########################################################################

  # - key: user_info.country.takeaway.css2025
  #   t: >
  #     The survey remains U.S.-centric, but European countries continue

  - key: features.all_features.takeaway.css2025
    t: >
      सर्वे में शामिल सभी सुविधाओं में, `:has()` सबसे अधिक उपयोग की जाने वाली और सबसे अधिक पसंद की जाने वाली सुविधा है। यह भी ध्यान देने योग्य है कि **Subgrid** सबसे अधिक पसंद की जाने वाली रैंकिंग में दूसरे स्थान पर है, जबकि `aspect-ratio` उपयोग में #2 और भावना में #3 है।  

      **Subgrid** के बाद, `line-clamp` पर सबसे अधिक टिप्पणियाँ आईं, जिनमें से कई प्रतिक्रियाएँ इस फीचर के प्रति नकारात्मक थीं।  

      सबसे कम उपयोग की जाने वाली सुविधाएँ `sibling-count` और `sibling-index` थीं, जो समझ में आता है क्योंकि इनका ब्राउज़र समर्थन अभी भी नया और सीमित है। और सबसे कम पसंद की जाने वाली सुविधा कुल मिलाकर **Trigonometric Functions** थी… निस्संदेह "trigonometry" के कारण!  

      अंत में, यह सुनिश्चित करने के लिए कि कौन सी सुविधाएँ अभी उपयोग के लिए उपलब्ध हैं, **“Widely Available” Baseline Status** से फ़िल्टर करना न भूलें!

  - key: features.features_ratios_over_time.takeaway.css2025
    t: >
      समय के साथ रुझानों और संदर्भ में देखने से एक बहुत ही रोचक तस्वीर उभरती है। वर्ष-दर-वर्ष उपयोग में सबसे बड़ी वृद्धि वाला फीचर `text-wrap: pretty` है, जबकि सबसे बड़ी *साक्षरता* वृद्धि वाला फीचर `light-dark()` है।  

      **Color functions** भी ध्यान देने योग्य हैं क्योंकि उपयोग के मामले में वे चार्ट के निचले हिस्से में स्थान लेते हैं, जो शायद दर्शाता है कि उन्होंने अभी तक अपनी ऑडियंस नहीं पाई है।  

      अंत में, Appreciation टैब हमें यह देखने देता है कि एक फीचर में रुचि रखने वाले और वास्तव में इसका उपयोग करने वाले उपयोगकर्ताओं के बीच सकारात्मकता में क्या अंतर है। **Anchor positioning** में **-12%** की गिरावट दिखती है, जो संकेत दे सकती है कि API अपेक्षित उपयोगकर्ता के अनुकूल नहीं है।

  - key: features.layout_pain_points.takeaway.css2025
    t: >
      जबकि **Grid** निस्संदेह शक्तिशाली है, यह शक्ति एक कठिन सीखने की कर्व के साथ आती है, जो इस अपेक्षाकृत जटिल फीचर का उपयोग करना वास्तव में दर्दनाक बना सकती है।  

      रैंकिंग में आगे, ऊँचाई, overflow, पोज़िशनिंग और alignment से संबंधित मुद्दे CSS डेवलपर्स के लिए आम समस्याएँ बनी हुई हैं।

  - key: features.shapes_graphics_pain_points.takeaway.css2025
    t: >
      अब जब हम आयतों के साथ सहज हो गए हैं, हम त्रिकोण, वृत्त और बहुभुज जैसी जटिल आकृतियों की ओर देखने लगे हैं। दुख की बात है कि CSS केवल के साथ इन **complex shapes** को बनाना अभी भी कठिन है।  

      यही कारण है कि हम में से कई लोग **SVG** का सहारा लेते हैं–हालांकि इसमें भी अपनी समस्याएँ हैं।

  - key: features.colors_pain_points.takeaway.css2025
    t: >
      कई उत्तरदाताओं की इच्छा है कि CSS लाइट/डार्क डाइकोटोमी से आगे बढ़े और पूर्ण theming प्रबंधन के लिए अधिक टूल प्रदान करे, साथ ही रंग चुनते समय उचित **contrast** सुनिश्चित करने में बेहतर काम करे।  

      और जबकि नए color spaces जैसे `oklch()` निश्चित रूप से शक्तिशाली हैं, वे भी अपनी समस्याओं के साथ आते हैं।

  - key: features.interactions_pain_points.takeaway.css2025
    t: >
      जबकि हम में से कई लोग **scroll-driven animations** के बेहतर ब्राउज़र समर्थन का इंतजार कर रहे हैं, अन्य लोग नए interaction पैटर्न जैसे **carousels** में संभावित **accessibility issues** की ओर इशारा कर रहे हैं।  

      एक और आम समस्या “`auto` पर एनीमेशन” करना था, जो अब [संभव](https://developer.chrome.com/docs/css-ui/animate-to-height-auto) है!

  - key: features.typography_pain_points.takeaway.css2025
    t: >
      ब्राउज़र में vertical text alignment (अथवा **leading**) को नियंत्रित करना हमेशा एक समस्या रही है। शुक्र है कि `text-box-edge` और `text-box-trim` हमें ऑनलाइन टाइप को सही तरीके से सेट करने के लिए अधिक सूक्ष्म टूल प्रदान करने का वादा करते हैं।

  - key: features.math_features_pain_points.takeaway.css2025
    t: >
      कई उत्तरदाताओं को `calc()` के बारे में शिकायतें थीं, खासकर गणना में यूनिट्स को संभालने के मामले में।

  - key: features.other_features_pain_points.takeaway.css2025
    t: >
      यहाँ कोई आश्चर्य नहीं है, लेकिन **Browser Support** इस अनुभाग में बताए गए CSS फीचर्स के लिए मुख्य समस्या बनी हुई है।

  - key: features.reading_list.takeaway.css2025
    t: >
      कम-ज्ञात `::target-text` (केवल 82% उत्तरदाताओं ने इसके बारे में कभी नहीं सुना) उन सुविधाओं की Reading List रैंकिंग में शीर्ष पर है जिनके बारे में उत्तरदाता सबसे अधिक उत्सुक थे।

  # other_tools

  - key: tools.css_frameworks.takeaway.css2025
    t: >
      Tailwind फ्रेमवर्क रैंकिंग में शीर्ष पर है, और ऐसा लगता है कि यह थोड़े कम अनुभव वाले डेवलपर्स (माध्य अनुभव 10 वर्ष) को अधिक पसंद आता है, जबकि अधिक अनुभवी उत्तरदाता कस्टम या इन-हाउस फ्रेमवर्क (माध्य अनुभव 15 वर्ष) का उपयोग करते हैं।  

      इसके बावजूद, यह ध्यान देने योग्य है कि **47%** सर्वे उत्तरदाता या तो फ्रेमवर्क का उपयोग नहीं करते हैं, या इस प्रश्न को पूरी तरह से छोड़ दिया।

  - key: tools.css_in_js.takeaway.css2025
    t: >
      **CSS Modules** का हल्का उपयोग अभी भी लोकप्रिय बना हुआ है, जबकि **Styled Components** अभी भी दूसरे स्थान पर मजबूती से बना हुआ है।

  - key: tools.pre_post_processors.takeaway.css2025
    t: >
      **Sass** अभी भी नंबर एक है, लेकिन प्री-प्रोसेसर का कुल उपयोग धीरे-धीरे घट रहा है क्योंकि CSS स्वयं उनके अधिक से अधिक फीचर्स को अपनाता जा रहा है।

  - key: tools.utilities.takeaway.css2025
    t: >
      किसी भी डेवलपर के लिए **Prettier** का उपयोग एक सुरक्षित विकल्प है–लेकिन नीचे दी गई सूची में कई अन्य कम-ज्ञात टूल्स भी हैं जिन्हें देखना उपयोगी हो सकता है।

  - key: tools.browsers.takeaway.css2025
    t: >
      ब्राउज़रों की बात करें तो, बड़े चार ब्राउज़र किसी कारण से बड़े चार हैं, और उन्होंने पिछले वर्ष की तुलना में लगभग समान उपयोग संख्या बनाए रखी।

  # usage

  - key: usage.form_factors.takeaway.css2025
    t: >
      जबकि परीक्षण वातावरण में साल-दर-साल ज्यादा बदलाव नहीं दिखता, यह उत्साहजनक है कि उत्तरदाताओं में कीबोर्ड-ओनली और स्क्रीन रीडर का उपयोग करने वालों की संख्या में थोड़ी बढ़ोतरी हुई है।  

      यह भी ध्यान देने योग्य है कि कंपनी के आकार की तुलना करने पर, बड़ी कंपनियां स्क्रीन रीडर का उपयोग अधिक दर से करती हैं।

  - key: usage.what_do_you_use_css_for.takeaway.css2025
    t: >
      CSS ने शुरुआत में डॉक्यूमेंट लेआउट सिस्टम के रूप में जीवन शुरू किया था, लेकिन अब यह स्पष्ट है कि इंटरैक्टिव ऐप्स इसका मुख्य उपयोग हैं–एक तथ्य जिसने निश्चित रूप से भाषा के हालिया विकास को प्रभावित किया है।

  - key: usage.industry_sector.takeaway.css2025
    t: >
      हम में से कई ऐसे टूल्स बना रहे हैं जो डेवलपर समुदाय के अंदर आंतरिक रूप से उपयोग किए जाएंगे, जिससे नए फीचर्स को अपनाना आसान हो जाता है बिना ब्राउज़र संगतता की बहुत चिंता किए।

  - key: usage.css_interoperability_features.takeaway.css2025
    t: >
      केवल **Anchor Positioning** ने ही अपना नंबर एक स्थान नहीं बनाए रखा, बल्कि इसे उद्धृत करने वाले उत्तरदाताओं का प्रतिशत लगभग दोगुना हो गया।  

      **View Transition API** भी नंबर 3 तक चढ़ा, जबकि **Container style queries** ने रैंकिंग में शानदार **11 स्थान** हासिल किए।  

      दूसरी ओर, **CSS Nesting** और `:has()` दोनों ने जमीन खोई, जो समझ में आता है क्योंकि ये फीचर्स अब सभी प्रमुख ब्राउज़रों में समर्थित हैं।

  - key: usage.css_missing_features.takeaway.css2025
    t: >
      डेवलपर्स अभी भी सबसे ज्यादा **Mixins** फीचर की कामना करते हैं, इसके बाद **Masonry Layout** का स्थान है। दोनों लंबे समय से प्री-प्रोसेसर या JavaScript जैसी वर्कअराउंड का उपयोग करके संभव थे, लेकिन इसे CSS में मूल रूप से सपोर्ट करना अच्छा रहेगा!

  - key: usage.css_general_pain_points.takeaway.css2025
    t: >
      2025 में भी **ब्राउज़र सपोर्ट** मुख्य CSS परेशानी हो सकती है, लेकिन यह तथ्य कि केवल 10% उत्तरदाताओं ने इसका उल्लेख किया, हाल के सुधारों का प्रमाण है।

  - key: usage.favorite_new_features.takeaway.css2025
    t: >
      जबकि `:has()` अभी भी नंबर एक है, यह थोड़ा पीछे हो गया है, क्योंकि **View Transition API** और खासकर **Anchor Positioning** (जिसने 8 स्थान बढ़ाए) अब व्यापक रूप से अपनाया जा रहा है।

  - key: usage.gamechanger_feature.takeaway.css2025
    t: >
      हर नए CSS फीचर का अपना उपयोग है, लेकिन केवल कुछ ही वास्तविक गेम-चेंजर हैं। ऐसा लगता है कि **Grid**, `:has()`, और **CSS Nesting** वे फीचर्स हैं जिन्होंने हाल के वर्षों में CSS लिखने के तरीके को सबसे ज्यादा बदला है।

  - key: usage.baseline_awareness.takeaway.css2025
    t: >
      हम यह देखना चाहते थे कि उत्तरदाता Baseline ब्राउज़र संगतता संकेतक से कितने परिचित हैं (जिसे आप इन सर्वे परिणामों में देख सकते हैं)।  

      हमारे फर्जी उत्तरों के रूप में बनाए गए चालाक जालों के बावजूद, आप में से अधिकांश ने सवाल को सफलतापूर्वक हल किया! विशेष रूप से युवा उत्तरदाताओं ने Baseline के प्रति अधिक जागरूकता दिखाई, बिना किसी संदेह के हाल ही में Fortnite में Baseline इंटीग्रेशन के कारण (…बस मजाक कर रहा हूँ)।

  - key: usage.css_pace_of_change.takeaway.css2025
    t: >
      किसी नए फीचर को अपनाना आमतौर पर एक बहु-चरणीय प्रक्रिया होती है: पहले, आप इसे महीनों या वर्षों में कई बार सुनते हैं, जब तक कि आपको इसके कार्य की ठोस समझ नहीं हो जाती। फिर, आप इसे किसी प्रयोगात्मक साइड प्रोजेक्ट में आजमा सकते हैं, और अंत में प्रोडक्शन में अपनाते हैं।  

      यह चार्ट दिखाता है कि हम में से अधिकांश इस यात्रा के मध्य में हैं, केवल सर्वे में प्रस्तुत फीचर सेट का एक हिस्सा सीखकर और आजमा कर।

  - key: usage.state_of_the_web_happiness.takeaway.css2025
    t: >
      पिछले वर्षों में वेब के प्रति संतोष काफी स्थिर रहा है, न बढ़ा और न घटा।

  - key: usage.state_of_css_happiness.takeaway.css2025
    t: >
      दूसरी ओर, CSS के प्रति संतोष हाल के वर्षों में स्पष्ट रूप से ऊपर की ओर बढ़ रहा है, जो कि भाषा के तेज सुधार की गति के साथ अच्छी तरह मेल खाता है।

  # resources
  - key: resources.podcasts.takeaway.css2025
    t: >
      पॉडकास्ट क्षेत्र में **Syntax** अभी भी राज कर रहा है, और इसने सुनने वालों में **+8%** का बढ़ोतरी भी हासिल की!  

      सम्मानजनक उल्लेख जाता है **Kevin Powell के पॉडकास्ट** और **Podrocket** को, दोनों ने 4 स्थान की बढ़त हासिल की।

  - key: resources.video_creators.takeaway.css2025
    t: >
      **Kevin Powell** ने YouTube पर CSS का एक विशेष स्थान बना लिया है, लेकिन अधिक सामान्य रुचि वाले क्रिएटर्स जैसे **Theo** और **The Primeagen** उसके पीछे तेजी से बढ़ रहे हैं।  

      **Syntax** भी वीडियो में अपने सफल संक्रमण को जारी रख रहा है, पिछले वर्ष की तुलना में **5%** दर्शक और **5 रैंक** बढ़त हासिल की।

  - key: resources.people.takeaway.css2025
    t: >
      **Josh**, **Kevin**, **Adam**, और **Una** अभी भी CSS इन्फ्लुएंसर रैंकिंग में शीर्ष पर हैं–यह तथ्य इस बात से दिखता है कि आप जान गए कि मैं किसके बारे में बात कर रहा हूँ बिना उनके अंतिम नाम बताए।

  - key: resources.web_platform_resources.takeaway.css2025
    t: >
      CSS सीखने के लिए **MDN** एक शानदार मुफ्त संसाधन है, लेकिन यह अकेला नहीं है, जैसा कि इस उपयोगी लिंक की छोटी सूची से पता चलता है।

  - key: resources.other_surveys.takeaway.css2025
    t: >
      जबकि उत्तरदाता ज्यादातर अन्य “State of” सर्वे और **Stack Overflow** सर्वे में भी भाग लेते हैं, **JetBrains Developer Ecosystem Survey** को भी जानना उपयोगी है।

