locale: hi-IN
translations:
  - key: general.css2025.html2025_banner
    t: |
      HTML सर्वे में भाग लें और वेब के भविष्य को आकार देने में मदद करें! →

  - key: general.css2025.survey_intro
    t: |
      मेरे CSS वॉishlist में 2025 के लिए केवल एक ही चीज़ है: धीमी गति!

      तेज़ नवाचार के वर्षों के बाद, अब ऐसा लगता है कि ब्राउज़र विक्रेताओं के लिए एक विराम लेने, असंगतियों को ठीक करने और बाकी लोगों को पकड़ने का सही समय है।  

      आखिरकार, हमने सबग्रिड, `:has()`, स्क्रॉल-ड्रिवन एनिमेशन और सभी अन्य हाल की CSS सुधारों के बारे में सुना होगा – लेकिन हम में से कितने कह सकते हैं कि हमने वास्तव में इन सभी सुविधाओं का उपयोग किया है, और उन्हें मास्टर किया है?

      यही कारण है कि इस साल का सर्वे बहुत दिलचस्प होगा। यह देखने का अवसर होगा कि पिछले कुछ वर्षों में कौन-कौन सी नई CSS सुविधाएँ समुदाय द्वारा अपनाई जा चुकी हैं और कौन-सी अभी भी हमारे टू-डू लिस्ट में हैं। 

      तो एक बार फिर, कृपया इस साल के स्टेट ऑफ CSS में मेरे साथ जुड़ें!

  - key: introduction.css2025
    t: |
      <span class="first-letter">O</span>इन सभी नए CSS फीचर्स को अपनाने में धीमे होने के लिए माफ़ किया जा सकता है। आखिरकार, क्या हमें वास्तव में इनकी ज़रूरत है? और यदि है भी, तो क्या ये ब्राउज़रों में विश्वसनीय रूप से काम करते हैं?

      लेकिन जैसे ही बेसलाइन संकेत एक के बाद एक हरे हो जाते हैं, और नई फ़ंक्शन और प्रॉपर्टीज़ के साथ संतोष उच्च रहता है, सबसे हिचकिचाने वाले भी मानना पड़ सकता है कि `:has()`, `aspect-ratio`, और Cascade Layers जैसी सुविधाएँ हमारे स्टाइलशीट में अपनी जगह बना चुकी हैं। 

      एकमात्र सवाल यह है *कब*। बहुत जल्दी, और आप शुरुआती अपनाने वाले के दर्द में फँस सकते हैं। बहुत देर से, और आप समय बचाने वाले सुधारों से चूक जाएंगे। 

      सौभाग्य से, अब इस सवाल का जवाब देने के लिए उपकरणों और संसाधनों की एक मजबूत इकोसिस्टम मौजूद है–और इसकी शुरुआत इसी सर्वे से होती है!

      <span class="conclusion__byline">– साचा ग्रेइफ़</span>

