  - key: faq.how_long_will_survey_take_css2025
    aliasFor: faq.how_long_will_survey_take_css2024
  - key: faq.how_long_will_survey_take_css2025.description
    aliasFor: faq.how_long_will_survey_take_css2024.description

  - key: faq.learn_more_css2025
    t: मैं और कहाँ सीख सकता हूँ?

  - key: faq.learn_more_css2025.description
    t: आप इस सर्वे के बारे में और जान सकते हैं [हमारे घोषणा पोस्ट](https://dev.to/sachagreif/the-2024-state-of-css-survey-is-now-open-4o5h) में।

  - key: faq.survey_design_css2025
    t: इस सर्वे का डिज़ाइन कैसे किया गया था?

  - key: faq.survey_design_css2025.description
    t: >
      इस सर्वे को [ओपन डिज़ाइन प्रक्रिया](https://github.com/Devographics/surveys/issues/289) के परिणामस्वरूप तैयार किया गया था, जिसमें ब्राउज़र विक्रेता और वेब डेवलपमेंट समुदाय शामिल थे।

  - key: faq.results_released_css2025
    t: परिणाम कब जारी किए जाएंगे?

  - key: faq.results_released_css2025.description
    t: सर्वे 1 जून से 1 जुलाई, 2025 तक चलेगा, और सर्वे के परिणाम इसके तुरंत बाद जारी किए जाएंगे।

  - key: about.content.css2025
    t: >
      2025 के स्टेट ऑफ CSS सर्वे 1 जून से 15 जुलाई 2025 तक चला, और इसमें 5,506 प्रतिक्रियाएं एकत्र की गईं। यह सर्वे [Devographics](https://www.devographics.com/) द्वारा आयोजित किया गया था, जिसमें ओपन-सोर्स योगदानकर्ताओं और सलाहकारों की एक टीम ने मदद की। 

      स्टेट ऑफ CSS का लोगो और टी-शर्ट [Christopher Kirk-Nielsen](http://chriskirknielsen.com/) द्वारा डिज़ाइन और एनिमेट किया गया।

      ### सर्वे के उद्देश्य

      यह सर्वे वेब डेवलपमेंट इकोसिस्टम में आने वाले रुझानों की पहचान करने के लिए बनाया गया था ताकि डेवलपर्स तकनीकी विकल्पों का निर्णय बेहतर तरीके से ले सकें। 

      इसलिए, यह सर्वे मुख्य रूप से आने वाले वर्षों में क्या नया होगा, इसे अनुमान लगाने पर केंद्रित है, न कि वर्तमान में क्या लोकप्रिय है, यही कारण है कि वर्तमान में सबसे व्यापक रूप से इस्तेमाल होने वाले फीचर्स या तकनीकों को हमेशा शामिल नहीं किया गया है। 

      इसके अतिरिक्त, सर्वे डेटा का उपयोग ब्राउज़र विक्रेताओं द्वारा फीचर्स को प्राथमिकता देने और [Interop 2025](https://web.dev/blog/interop-2025) जैसी पहलों के लिए किया जाता है।

      ### सर्वे डिज़ाइन

      इस सर्वे को सहयोगात्मक रूप से [GitHub पर](https://github.com/Devographics/surveys/issues/245) डिज़ाइन किया गया था।

      ### सर्वे प्रतिभागी

      सर्वे ऑनलाइन सभी के लिए खुला था और प्रतिभागियों को किसी भी तरह से फ़िल्टर या चयनित नहीं किया गया। प्रतिभागी मुख्य रूप से पिछले सर्वेक्षणों के मिश्रित उत्तरदाता थे (विशेष मेलिंग सूची के माध्यम से सूचित) और सोशल मीडिया ट्रैफ़िक के माध्यम से आए थे। 

      ### परियोजना वित्तपोषण

      टी-शर्ट की बिक्री के अलावा, इस परियोजना के वित्तपोषण के स्रोत विभिन्न हैं:

      - हमारे पार्टनर [Frontend Masters](https://frontendmasters.com/) सर्वे को प्रायोजित करते हैं और इसके बदले प्रत्येक पेज के नीचे अपने कोर्स लिंक को दिखाते हैं।

      - [Google Chrome](https://www.google.com/chrome/) टीम ने इस साल सर्वे को डिजाइन और चलाने में मदद के लिए बजट निर्धारित किया।

      - [TokyoDev](https://www.tokyodev.com/) भी सर्वे को लगातार प्रायोजित कर रहा है। 

      ### तकनीकी अवलोकन

      आप सर्वे चलाने की विस्तृत तकनीकी जानकारी [यहां](https://dev.to/sachagreif/how-the-devographics-surveys-are-run-2023-edition-1p6a) पा सकते हैं। हमारा कोड [ओपन-सोर्स](https://github.com/Devographics/Monorepo/) है। 

      ### फीडबैक

      - [तकनीकी समस्या रिपोर्ट करें](https://github.com/Devographics/Monorepo/issues)
      - [अगले साल के लिए सुझाव दें](https://github.com/Devographics/surveys/issues/249)
      - [अन्य गैर-तकनीकी मुद्दे](https://github.com/Devographics/surveys/issues)
      - [हमारे Discord में शामिल हों](https://discord.gg/tuWRUWVyJs)

