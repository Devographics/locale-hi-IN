  - key: picks.sara_joy.bio
    t: फ्रंट एंड डेवलपर
  - key: picks.sara_joy.description
    t: |
      एक बार CSS में `color-scheme` का उपयोग करने के बाद, `light-dark()` का उपयोग करके रंग घोषित करना कि वर्तमान में लाइट या डार्क मोड में कौन सा उपयोग हो रहा है, बिल्कुल सहज लगता है। मैं वर्तमान में [इस चर्चा थ्रेड](https://github.com/w3c/csswg-drafts/issues/10577) को फॉलो करके आनंद ले रहा/रही हूँ, जो भविष्य में color-scheme को क्वेरी करने और CSS को सशर्त बदलने के लिए और किन तर्कों का उपयोग किया जा सकता है, इसके बारे में है।

